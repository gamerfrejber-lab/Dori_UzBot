# Prod profili (ixtiyoriy): Railway'da SPRING_PROFILES_ACTIVE=prod qo'yilsa yoqiladi.
# Sxema har ishga tushishda tekshirilmaydi va data.sql bajarilmaydi — ishga tushish tezroq va xavfsizroq.
# Indekslar baribir IndeksYaratuvchi orqali yaratiladi.
# DIQQAT: yangi jadval yoki ustun qo'shiladigan versiyani deploy qilishdan oldin bu profilni vaqtincha olib tashlang
# (yoki JPA_DDL_AUTO=update qo'ying), aks holda yangi ustun yaratilmaydi.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.sql.init.mode=${SQL_INIT_MODE:never}
