<!DOCTYPE html>
<html lang="uz">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="auth-guard.js"></script>
    <script src="stickers.js"></script>
    <script src="swipe.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dorixonalar - Dori Qidiruv</title>
    <style>
        /* ============================================================
           Dorixonalar sahifasi — bosh sahifa bilan bir xil "suyuq shisha".
           Izohlar uchun index.html dagi uslub bo'limiga qarang.
           ============================================================ */

        :root {
            --bg-0: #03100D;
            --bg-1: #061815;
            --ink: #E9F3F0;
            --ink-dim: #8FA8A1;
            --ink-faint: #5D726C;
            --teal: #16C6A4;
            --teal-deep: #0E6B5C;
            --sea: #0A4C57;
            --glass: rgba(255, 255, 255, 0.055);
            --glass-hi: rgba(255, 255, 255, 0.095);
            --hairline: rgba(255, 255, 255, 0.13);
            --r-xl: 32px;
            --r-lg: 26px;
            --r-md: 18px;
            --spring: cubic-bezier(0.22, 1.15, 0.36, 1);
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI Variable Display',
                         'Segoe UI', system-ui, sans-serif;
            background: var(--bg-0);
            min-height: 100vh;
            color: var(--ink);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .aurora {
            position: fixed; inset: 0; z-index: -1; overflow: hidden;
            background:
                radial-gradient(1100px 700px at 50% -12%, #0F3B34 0%, transparent 62%),
                linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 58%);
        }
        .aurora span {
            position: absolute; display: block; border-radius: 50%;
            filter: blur(80px); opacity: 0.85; will-change: transform;
        }
        .aurora span:nth-child(1) {
            width: 46vw; height: 46vw; min-width: 340px; min-height: 340px;
            left: -8vw; top: -6vw;
            background: radial-gradient(circle, #12907A, transparent 68%);
            animation: suzish-a 26s var(--ease) infinite alternate;
        }
        .aurora span:nth-child(2) {
            width: 40vw; height: 40vw; min-width: 300px; min-height: 300px;
            right: -6vw; top: 10vh;
            background: radial-gradient(circle, #0D6C7A, transparent 68%);
            animation: suzish-b 32s var(--ease) infinite alternate;
        }
        .aurora span:nth-child(3) {
            width: 34vw; height: 34vw; min-width: 250px; min-height: 250px;
            left: 32vw; bottom: -10vw; opacity: 0.55;
            background: radial-gradient(circle, #1E8A66, transparent 70%);
            animation: suzish-c 38s var(--ease) infinite alternate;
        }
        @keyframes suzish-a { to { transform: translate3d(9vw, 7vh, 0) scale(1.14); } }
        @keyframes suzish-b { to { transform: translate3d(-8vw, 10vh, 0) scale(1.1); } }
        @keyframes suzish-c { to { transform: translate3d(6vw, -9vh, 0) scale(1.18); } }

        /* ——— Shisha yuza ——— */
        .glass-card, header, .modal, .lang-switch {
            position: relative;
            background: linear-gradient(160deg, var(--glass-hi) 0%, var(--glass) 42%, rgba(255,255,255,0.03) 100%);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.30),
                inset 0 -1px 0 rgba(255, 255, 255, 0.05),
                inset 0 0 30px rgba(255, 255, 255, 0.035),
                0 18px 50px rgba(0, 0, 0, 0.5),
                0 3px 10px rgba(0, 0, 0, 0.32);
        }

        .glass-card::after, .modal::after {
            content: ''; position: absolute; inset: 0;
            border-radius: inherit; padding: 1px;
            background: linear-gradient(145deg,
                rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.08) 26%,
                rgba(255,255,255,0) 52%, rgba(255,255,255,0.06) 74%, rgba(255,255,255,0.22) 100%);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
            pointer-events: none;
        }

        .glass-card::before {
            content: ''; position: absolute; inset: 0; border-radius: inherit;
            background: radial-gradient(340px circle at var(--mx, 50%) var(--my, 0%),
                rgba(255,255,255,0.13), transparent 45%);
            opacity: 0; transition: opacity 0.45s var(--ease); pointer-events: none;
        }
        .glass-card:hover::before { opacity: 1; }

        /* ——— Sarlavha ——— */
        header {
            padding: 0.85rem 1.6rem;
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid var(--hairline);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
            transition: background 0.4s var(--ease), box-shadow 0.4s var(--ease),
                        padding 0.3s var(--ease), backdrop-filter 0.4s var(--ease);
        }
        header.scrolled {
            background: rgba(3, 16, 13, 0.92);
            backdrop-filter: blur(40px) saturate(220%);
            -webkit-backdrop-filter: blur(40px) saturate(220%);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6),
                        0 1px 0 rgba(22, 198, 164, 0.25),
                        0 6px 20px rgba(22, 198, 164, 0.08);
            border-bottom: 1px solid rgba(22, 198, 164, 0.35);
            padding-top: 0.6rem;
            padding-bottom: 0.6rem;
        }
        .header-content {
            max-width: 1180px; margin: 0 auto;
            display: flex; justify-content: space-between; align-items: center; gap: 1rem;
        }
        .logo { font-size: 1.28rem; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; }

        nav { display: flex; gap: 1.4rem; align-items: center; }
        nav a {
            color: var(--ink-dim); text-decoration: none; font-size: 0.94rem;
            font-weight: 500; position: relative; padding: 0.3rem 0;
            transition: color 0.3s var(--ease);
        }
        nav a::after {
            content: ''; position: absolute; left: 50%; right: 50%; bottom: -2px;
            height: 1.5px; border-radius: 2px;
            background: linear-gradient(90deg, var(--teal), var(--teal-deep));
            transition: left 0.35s var(--spring), right 0.35s var(--spring);
        }
        nav a:hover { color: var(--ink); }
        nav a:hover::after { left: 0; right: 0; }

        .lang-switch {
            display: flex; gap: 0.25rem; padding: 0.24rem; border-radius: 999px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), inset 0 0 0 1px rgba(255,255,255,0.07);
        }
        .lang-btn {
            padding: 0.34rem 0.86rem; border: none; background: transparent;
            color: var(--ink-faint); border-radius: 999px; cursor: pointer;
            font-size: 0.82rem; font-weight: 600; letter-spacing: 0.03em; font-family: inherit;
            transition: color 0.3s var(--ease), background 0.4s var(--ease);
        }
        .lang-btn:hover { color: var(--ink-dim); }
        .lang-btn.active {
            color: #04211C;
            background: linear-gradient(140deg, #3AE0BC, var(--teal));
            box-shadow: 0 3px 14px rgba(22,198,164,0.4), inset 0 1px 0 rgba(255,255,255,0.4);
        }

        .profile-btn {
            padding: 0.6rem 1.35rem; border: none;
            background: linear-gradient(140deg, #3AE0BC, var(--teal) 55%, var(--teal-deep));
            color: #04211C; border-radius: 999px; cursor: pointer;
            font-weight: 650; font-size: 0.92rem; font-family: inherit;
            text-decoration: none; white-space: nowrap; display: inline-block;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 6px 20px rgba(22,198,164,0.3);
            transition: transform 0.35s var(--spring), filter 0.3s var(--ease);
        }
        .profile-btn:hover { transform: translateY(-2px); filter: brightness(1.06); }
        .profile-btn:active { transform: translateY(0) scale(0.97); }

        /* ——— Sahifa ——— */
        .container { max-width: 1180px; margin: 0 auto; padding: 2.5rem 1.6rem 3rem; }

        .page-title {
            font-size: clamp(1.7rem, 1.2rem + 2vw, 2.6rem);
            font-weight: 700; letter-spacing: -0.032em; line-height: 1.08;
            margin-bottom: 0.5rem; text-wrap: balance;
            background: linear-gradient(178deg, #FFFFFF 20%, #A9C7C0 100%);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: var(--ink-dim); font-size: 0.98rem; margin-bottom: 1.8rem; }

        .pharmacies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.1rem;
        }

        .glass-card { border-radius: var(--r-lg); padding: 1.5rem; }

        .pharmacy-card {
            cursor: pointer;
            transition: transform 0.5s var(--spring), box-shadow 0.5s var(--ease);
        }
        .pharmacy-card h3 {
            font-size: 1.1rem; font-weight: 650; letter-spacing: -0.015em; margin-bottom: 0.9rem;
        }
        .pharmacy-card:hover {
            transform: translateY(-6px);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.34),
                inset 0 0 30px rgba(255,255,255,0.05),
                0 28px 60px rgba(0,0,0,0.55),
                0 0 0 1px rgba(22,198,164,0.22);
        }
        .pharmacy-card:active { transform: translateY(-2px) scale(0.99); }

        .pharmacy-info { display: flex; flex-direction: column; gap: 0.45rem; }
        .info-row { display: flex; gap: 0.6rem; align-items: flex-start; }
        .info-icon { flex: 0 0 auto; opacity: 0.85; }
        .info-text { color: var(--ink-dim); font-size: 0.93rem; line-height: 1.5; }

        .map-btn {
            width: 100%; margin-top: 1.1rem; padding: 0.75rem 1.1rem;
            border: none; border-radius: var(--r-md);
            background: rgba(255, 255, 255, 0.08);
            color: var(--ink); font-weight: 600; font-size: 0.9rem; font-family: inherit;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
            transition: background 0.3s var(--ease), transform 0.35s var(--spring);
        }
        .map-btn:hover { background: rgba(255,255,255,0.14); transform: translateY(-2px); }
        .map-btn:active { transform: translateY(0) scale(0.98); }

        /* ——— Modal ——— */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(2, 10, 9, 0.68);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            padding: 1.4rem; z-index: 200;
            opacity: 0; visibility: hidden;
            transition: opacity 0.4s var(--ease), visibility 0.4s;
        }
        .modal-overlay.show { opacity: 1; visibility: visible; }

        .modal {
            border-radius: var(--r-xl); padding: 1.9rem;
            max-width: 540px; width: 100%; max-height: 86vh; overflow-y: auto;
            position: relative;
            transform: translateY(22px) scale(0.96); opacity: 0;
            transition: transform 0.5s var(--spring), opacity 0.4s var(--ease);
        }
        .modal-overlay.show .modal { transform: translateY(0) scale(1); opacity: 1; }

        .modal h2 {
            font-size: 1.35rem; font-weight: 680; letter-spacing: -0.022em;
            margin-bottom: 1.1rem; padding-right: 2.4rem;
        }
        .modal h3 { font-size: 1.02rem; font-weight: 650; }

        .modal-close {
            position: absolute; top: 1.1rem; right: 1.1rem;
            width: 34px; height: 34px; border: none; border-radius: 50%;
            background: rgba(255,255,255,0.09); color: var(--ink);
            font-size: 1.4rem; line-height: 1; cursor: pointer;
            display: grid; place-items: center;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
            transition: background 0.3s var(--ease), transform 0.4s var(--spring);
        }
        .modal-close:hover { background: rgba(255,255,255,0.17); transform: rotate(90deg); }

        .back-btn {
            background: none; border: none; color: var(--teal);
            font-size: 0.9rem; font-weight: 600; font-family: inherit;
            cursor: pointer; padding: 0 0 0.8rem;
            transition: opacity 0.3s var(--ease), transform 0.3s var(--spring);
        }
        .back-btn:hover { opacity: 0.75; transform: translateX(-3px); }

        /* ——— Dorilar ro'yxati ——— */
        .drug-list { margin-top: 1.3rem; }

        .drug-row {
            display: flex; justify-content: space-between; align-items: center;
            gap: 0.8rem; padding: 0.8rem 0;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
        }
        .drug-row:first-of-type { border-top: none; }

        .drug-clickable {
            cursor: pointer; border-radius: 12px;
            padding-left: 0.6rem; padding-right: 0.6rem;
            margin-left: -0.6rem; margin-right: -0.6rem;
            transition: background 0.3s var(--ease);
        }
        .drug-clickable:hover { background: rgba(255, 255, 255, 0.055); }

        .drug-name { display: block; font-weight: 600; font-size: 0.97rem; }
        .drug-manufacturer { display: block; font-size: 0.83rem; color: var(--ink-faint); margin-top: 0.15rem; }
        .drug-price { color: var(--teal); font-weight: 650; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .drug-out { color: var(--ink-faint); font-size: 0.85rem; white-space: nowrap; }

        .loading { text-align: center; padding: 3rem 1rem; color: var(--ink-dim); }

        footer {
            text-align: center; padding: 2.5rem 1.6rem 3rem;
            color: var(--ink-faint); font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06); margin-top: 3rem;
        }

        /* ——— Kirish animatsiyasi ——— */
        @keyframes kotarilish {
            from { opacity: 0; transform: translateY(26px); filter: blur(6px); }
            to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
        }
        .anim { animation: kotarilish 0.85s var(--spring) both; }
        .anim-1 { animation-delay: 0.06s; }
        .anim-2 { animation-delay: 0.16s; }

        @media (max-width: 768px) {
            header { padding: 0.7rem 1rem; }
            .header-content { flex-wrap: wrap; gap: 0.7rem; }
            .logo { font-size: 1.1rem; }
            nav { gap: 0.9rem; width: 100%; justify-content: space-between; }
            nav a { font-size: 0.88rem; }
            .profile-btn { padding: 0.5rem 1rem; font-size: 0.85rem; }
            .container { padding: 1.8rem 1rem 2rem; }
            .pharmacies-grid { grid-template-columns: 1fr; }
            .modal { padding: 1.5rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            html { scroll-behavior: auto; }
        }

        :focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

    <header>
        <div class="header-content">
            <div class="logo"><img class="stk stk-lg" data-stk="pill" alt="" src="icons/pill.png" onerror="stkFallback(this)"> Dori Qidiruv</div>
            <nav>
                <a href="index.html" data-uz="Bosh sahifa" data-ru="Главная">Bosh sahifa</a>
                <a href="dorixonalar.html" data-uz="Dorixonalar" data-ru="Аптеки">Dorixonalar</a>
                <div class="lang-switch">
                    <button type="button" class="lang-btn active" data-lang="uz" onclick="setLang('uz')">UZ</button>
                    <button type="button" class="lang-btn" data-lang="ru" onclick="setLang('ru')">RU</button>
                </div>
                <a href="profil.html" class="profile-btn" id="profileBtn" data-uz="Profil" data-ru="Профиль"><img class="stk stk-nav" data-stk="user" alt="" src="icons/user.png" onerror="stkFallback(this)"> Kirish</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title anim anim-1" data-uz="Barcha dorixonalar" data-ru="Все аптеки">Barcha dorixonalar</h1>
        <p class="subtitle anim anim-2" data-uz="Dorixona ustiga bosing — undagi mahsulotlar va narxlar ko'rinadi" data-ru="Нажмите на аптеку — увидите её товары и цены">Dorixona ustiga bosing — undagi mahsulotlar va narxlar ko'rinadi</p>
        
        <div id="pharmaciesContainer">
            <div class="loading" data-uz="Yuklanmoqda" data-ru="Загрузка">Yuklanmoqda</div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
        <div class="modal" id="modalBox"></div>
    </div>

    <footer>
        <p data-uz="Dori Qidiruv — dorini topish va oldindan band qilish xizmati" data-ru="Dori Qidiruv — сервис поиска и брони лекарств">Dori Qidiruv — dorini topish va oldindan band qilish xizmati</p>
    </footer>

    <script>
        // Kirish nazorati auth-guard.js'da (Mini App avtomatik kirishi bilan birga) bajariladi.

        // Til tanlovi barcha sahifalarda bir xil saqlanadi (kirish sahifasidan boshlab).
        let currentLang = localStorage.getItem('lang') || 'uz';
        let userLocation = null;

        /** Lokatsiya nega olinmagani: 'unsupported' | 'denied' | 'unavailable' | null. */
        let locationError = null;

        /**
         * Brauzerdan joylashuvni so'raydi. Ruxsat berilmasa null qaytaradi va sababini
         * locationError'ga yozadi — foydalanuvchiga nima qilish kerakligini aytish uchun.
         *
         * enableHighAccuracy o'chirilgan: kompyuterlarda GPS yo'q va aniq joylashuvni
         * qidirish ko'pincha vaqt tugashi bilan tugardi, natijada masofa umuman
         * ko'rsatilmasdi. maximumAge yaqindagi javobni qayta ishlatadi.
         */
        function requestLocation() {
            return new Promise(resolve => {
                if (!navigator.geolocation) {
                    locationError = 'unsupported';
                    return resolve(null);
                }
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        locationError = null;
                        resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude });
                    },
                    err => {
                        locationError = err && err.code === 1 ? 'denied' : 'unavailable';
                        resolve(null);
                    },
                    { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 }
                );
            });
        }

        /** Masofa ko'rsatilmagan bo'lsa, sababini va nima qilish kerakligini tushuntiradi. */
        function locationBanner() {
            if (userLocation || !locationError) return '';
            const uz = currentLang === 'uz';
            let matn;
            if (locationError === 'denied') {
                matn = uz
                    ? 'Masofa ko\'rsatilmadi, chunki joylashuvga ruxsat berilmagan. Brauzer manzil satridagi 🔒 belgisini bosing → «Joylashuv» → «Ruxsat berish», so\'ng sahifani yangilang.'
                    : 'Расстояние не показано: доступ к геолокации запрещён. Нажмите 🔒 в адресной строке → «Местоположение» → «Разрешить», затем обновите страницу.';
            } else if (locationError === 'unsupported') {
                matn = uz
                    ? 'Bu brauzer joylashuvni aniqlay olmaydi, shuning uchun masofa ko\'rsatilmaydi.'
                    : 'Этот браузер не умеет определять местоположение, поэтому расстояние не показывается.';
            } else {
                matn = uz
                    ? 'Joylashuvni aniqlab bo\'lmadi, shuning uchun masofa ko\'rsatilmadi.'
                    : 'Не удалось определить местоположение, поэтому расстояние не показано.';
            }
            const tugma = locationError === 'denied' ? '' :
                `<button onclick="joylashuvniQaytaSora()" style="margin-top:0.7rem;padding:0.5rem 1.1rem;border:none;border-radius:20px;background:linear-gradient(140deg,#3AE0BC,#16C6A4 55%,#0E6B5C);color:#04211C;font-weight:600;cursor:pointer;">
                    ${stk('pin')} ${uz ? 'Joylashuvga ruxsat berish' : 'Разрешить геолокацию'}
                 </button>`;
            return `<div class="glass-card" style="border-color:rgba(79,195,247,0.35);margin-bottom:1rem;">
                        <p style="margin:0;">${stk('pin')} ${matn}</p>${tugma}
                    </div>`;
        }

        /** Banner tugmasi: joylashuvni qayta so'rab, ro'yxatni yangilaydi. */
        async function joylashuvniQaytaSora() {
            userLocation = await requestLocation();
            loadPharmacies();
        }

        /** Ikki koordinata orasidagi masofa (km) — Haversine formulasi. */
        function distanceKm(lat1, lon1, lat2, lon2) {
            const toRad = deg => deg * Math.PI / 180;
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat / 2) ** 2
                + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
            return 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function formatDistance(km) {
            return km < 1
                ? `${Math.round(km * 1000)} ${currentLang === 'uz' ? 'm' : 'м'}`
                : `${km.toFixed(1)} ${currentLang === 'uz' ? 'km' : 'км'}`;
        }

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            document.documentElement.lang = lang;

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
            });

            document.querySelectorAll('[data-uz]').forEach(el => {
                el.textContent = el.getAttribute('data-' + lang);
            });
        }

        // Bu sahifaga faqat token bilan kirilgani uchun profil tugmasi doim profilga olib boradi.
        const profileBtn = document.getElementById('profileBtn');
        profileBtn.href = 'profil.html';
        var _uIcon = '<img class="stk stk-nav" data-stk="user" alt="" src="icons/user.png" onerror="stkFallback(this)"> ';
        profileBtn.innerHTML = _uIcon + (localStorage.getItem('userName')
            || (currentLang === 'uz' ? 'Profil' : 'Профиль'));

        async function loadPharmacies() {
            userLocation = await requestLocation();
            try {
                const response = await fetch('/api/dorixona');
                const data = await response.json();
                displayPharmacies(sortByDistance(data));

                // Bosh sahifadan aniq bir dorixona tanlab kelingan bo'lsa, uni darhol ochamiz.
                const soralgan = sessionStorage.getItem('ochilsin');
                if (soralgan) {
                    sessionStorage.removeItem('ochilsin');
                    const orni = loadedPharmacies.findIndex(p => String(p.id) === soralgan);
                    if (orni >= 0) openPharmacy(orni);
                }
            } catch (error) {
                console.log('API unavailable', error);
                document.getElementById('pharmaciesContainer').innerHTML =
                    `<p class="subtitle">${currentLang === 'uz'
                        ? 'Dorixonalarni yuklab bo\'lmadi. Keyinroq urinib ko\'ring.'
                        : 'Не удалось загрузить аптеки. Попробуйте позже.'}</p>`;
            }
        }

        let loadedPharmacies = [];
        let loadedDrugs = [];
        let currentPharmacyIndex = null;

        function esc(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        /**
         * Ombor holati. Dorixona ombor hisobini yuritayotgan bo'lsa aniq qoldiq ko'rsatiladi;
         * hisob yuritilmagan mahsulotda qoldiq 0 chiqadi, lekin bu "tugagan" degani emas —
         * shuning uchun unda faqat mavjud/mavjud emas belgisi qoladi.
         */
        function omborHolati(drug, uz) {
            if (!drug.hisobYuritiladi) {
                return drug.available
                    ? (stk('available') + (uz ? ' Mavjud' : ' В наличии'))
                    : (stk('unavailable') + (uz ? ' Mavjud emas' : ' Нет в наличии'));
            }
            const qoldiq = drug.qoldiq || 0;
            if (qoldiq <= 0) return stk('unavailable') + (uz ? ' Tugagan' : ' Закончился');
            return stk('box') + (uz ? ' Omborda: ' : ' На складе: ') + '<b>' + qoldiq + '</b>' + (uz ? ' ta' : ' шт.');
        }

        /** Dorixonalarni foydalanuvchiga eng yaqinidan boshlab tartiblaydi va masofani qo'shadi. */
        function sortByDistance(pharmacies) {
            if (!userLocation || !Array.isArray(pharmacies)) return pharmacies;
            return pharmacies
                .map(ph => ({
                    ...ph,
                    _km: ph.latitude && ph.longitude
                        ? distanceKm(userLocation.lat, userLocation.lon, ph.latitude, ph.longitude)
                        : null
                }))
                .sort((a, b) => (a._km ?? Infinity) - (b._km ?? Infinity));
        }

        function displayPharmacies(pharmacies) {
            const container = document.getElementById('pharmaciesContainer');

            if (!pharmacies || pharmacies.length === 0) {
                container.innerHTML = '<p class="subtitle">'
                    + stk('sad') + ' ' + (currentLang === 'uz' ? 'Dorixonalar topilmadi' : 'Аптеки не найдены') + '</p>';
                return;
            }

            // Lokatsiya berilgan bo'lsa sarlavhani "eng yaqin" deb yangilaymiz
            if (userLocation) {
                const title = document.querySelector('.page-title');
                if (title) title.innerHTML = stk('pharmacy','stk-title') + ' ' + (currentLang === 'uz'
                    ? 'Menga yaqin dorixonalar'
                    : 'Ближайшие аптеки');
            }

            loadedPharmacies = pharmacies;
            const grid = document.createElement('div');
            grid.className = 'pharmacies-grid';

            grid.innerHTML = pharmacies.map((pharmacy, index) => {
                const hasLocation = pharmacy.latitude && pharmacy.longitude;
                return `
                <div class="glass-card pharmacy-card" onclick="openPharmacy(${index})">
                    <h3>${stk('pharmacy','stk-card')} ${esc(pharmacy.nomi || pharmacy.name)}</h3>
                    <div class="pharmacy-info">
                        <div class="info-row">
                            <span class="info-icon">${stk('pin')}</span>
                            <span class="info-text">${esc(pharmacy.manzil || pharmacy.address)}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-icon">${stk('phone')}</span>
                            <span class="info-text">${esc(pharmacy.telefon || pharmacy.phone)}</span>
                        </div>
                        ${pharmacy._km != null ? `<div class="info-row">
                            <span class="info-icon">${stk('ruler')}</span>
                            <span class="info-text">${formatDistance(pharmacy._km)}</span>
                        </div>` : ''}
                    </div>
                    ${hasLocation ? `<button class="map-btn" onclick="showOnMap(event, ${index})">
                        ${stk('pin')} ${currentLang === 'uz' ? 'Xaritada ko\'rish' : 'Показать на карте'}
                    </button>` : ''}
                </div>`;
            }).join('');

            container.innerHTML = locationBanner();
            container.appendChild(grid);
        }

        function showOnMap(event, index) {
            event.stopPropagation();
            const pharmacy = loadedPharmacies[index];
            if (!pharmacy || !pharmacy.latitude || !pharmacy.longitude) return;
            window.open(`https://yandex.com/maps/?pt=${pharmacy.longitude},${pharmacy.latitude}&z=17&l=map`, '_blank');
        }

        async function openPharmacy(index) {
            const pharmacy = loadedPharmacies[index];
            if (!pharmacy) return;
            currentPharmacyIndex = index;

            const overlay = document.getElementById('modalOverlay');
            const box = document.getElementById('modalBox');
            const name = esc(pharmacy.nomi || pharmacy.name);

            box.innerHTML = `
                <button class="modal-close" onclick="closeModal()">&times;</button>
                <h2>${stk('pharmacy','stk-lg')} ${name}</h2>
                <div class="pharmacy-info">
                    <div class="info-row"><span class="info-icon">${stk('pin')}</span><span class="info-text">${esc(pharmacy.manzil || pharmacy.address)}</span></div>
                    <div class="info-row"><span class="info-icon">${stk('phone')}</span><span class="info-text">${esc(pharmacy.telefon || pharmacy.phone)}</span></div>
                </div>
                <div class="drug-list"><p class="subtitle">${currentLang === 'uz' ? 'Dorilar yuklanmoqda...' : 'Загрузка лекарств...'}</p></div>`;
            overlay.classList.add('show');

            if (!pharmacy.id) return;
            try {
                const response = await fetch(`/api/dorixona/${pharmacy.id}/dorilar`);
                loadedDrugs = response.ok ? await response.json() : [];
                box.querySelector('.drug-list').innerHTML = renderDrugs(loadedDrugs);
            } catch (error) {
                box.querySelector('.drug-list').innerHTML =
                    `<p class="subtitle">${currentLang === 'uz' ? 'Dorilarni yuklab bo\'lmadi' : 'Не удалось загрузить лекарства'}</p>`;
            }
        }

        function renderDrugs(drugs) {
            if (!drugs || drugs.length === 0) {
                return `<p class="subtitle">${currentLang === 'uz' ? 'Bu dorixonada hozircha dori yo\'q' : 'В этой аптеке пока нет лекарств'}</p>`;
            }
            const title = stk('pill') + ' ' + (currentLang === 'uz' ? `Dorilar (${drugs.length})` : `Лекарства (${drugs.length})`);
            const rows = drugs.map((drug, i) => {
                const drugName = currentLang === 'ru' && drug.nameRu ? drug.nameRu : drug.name;
                const price = (drug.price || 0).toLocaleString();
                const tugagan = drug.hisobYuritiladi ? (drug.qoldiq || 0) <= 0 : !drug.available;
                const status = tugagan
                    ? `<span class="drug-out">${currentLang === 'uz' ? 'Tugagan' : 'Закончился'}</span>`
                    : `<span class="drug-price">${price} ${currentLang === 'uz' ? 'so\'m' : 'сум'}</span>`;
                const qoldiq = drug.hisobYuritiladi && (drug.qoldiq || 0) > 0
                    ? ` · ${stk('box')} ${drug.qoldiq} ${currentLang === 'uz' ? 'ta' : 'шт.'}`
                    : '';
                return `<div class="drug-row drug-clickable" onclick="openDrug(${i})">
                    <span><span class="drug-name">${esc(drugName)}</span>
                    <span class="drug-manufacturer">${esc(drug.manufacturer || '')}${qoldiq}</span></span>
                    ${status}
                </div>`;
            }).join('');
            return `<h3 style="margin-bottom:0.8rem;">${title}</h3>${rows}`;
        }

        /** Dori qatori bosilganda o'sha dori haqida to'liq ma'lumotni ko'rsatadi. */
        function openDrug(index) {
            const drug = loadedDrugs[index];
            const pharmacy = loadedPharmacies[currentPharmacyIndex];
            if (!drug) return;
            const uz = currentLang === 'uz';
            const box = document.getElementById('modalBox');
            const drugName = currentLang === 'ru' && drug.nameRu ? drug.nameRu : drug.name;

            box.innerHTML = `
                <button class="modal-close" onclick="closeModal()">&times;</button>
                <button class="back-btn" onclick="openPharmacy(${currentPharmacyIndex})">${uz ? '← Orqaga' : '← Назад'}</button>
                <h2>${stk('pill','stk-lg')} ${esc(drugName)}</h2>
                <div class="pharmacy-info">
                    ${drug.name ? `<div class="info-row"><span class="info-icon">${stk('label')}</span><span class="info-text">${uz ? 'Nomi' : 'Название'}: ${esc(drug.name)}</span></div>` : ''}
                    ${drug.nameRu ? `<div class="info-row"><span class="info-icon">${stk('ru')}</span><span class="info-text">${uz ? 'Ruscha nomi' : 'На русском'}: ${esc(drug.nameRu)}</span></div>` : ''}
                    <div class="info-row"><span class="info-icon">${stk('factory')}</span><span class="info-text">${uz ? 'Ishlab chiqaruvchi' : 'Производитель'}: ${esc(drug.manufacturer || '—')}</span></div>
                    ${drug.priceDona ? `<div class="info-row"><span class="info-icon">${stk('pill')}</span><span class="info-text">${uz ? 'Dona narxi' : 'Цена за шт'}: <b>${drug.priceDona.toLocaleString()} ${uz ? "so'm" : 'сум'}</b></span></div>` : ''}
                    ${drug.pricePachka ? `<div class="info-row"><span class="info-icon">${stk('box')}</span><span class="info-text">${uz ? 'Pachka narxi' : 'Цена за уп'}: <b>${drug.pricePachka.toLocaleString()} ${uz ? "so'm" : 'сум'}</b></span></div>` : ''}
                    ${!drug.priceDona && !drug.pricePachka ? `<div class="info-row"><span class="info-icon">${stk('money')}</span><span class="info-text">${uz ? 'Narxi' : 'Цена'}: <b>${(drug.price || 0).toLocaleString()} ${uz ? "so'm" : 'сум'}</b></span></div>` : ''}
                    <div class="info-row"><span class="info-icon">${stk('box')}</span><span class="info-text">${uz ? 'Holat' : 'Статус'}: ${omborHolati(drug, uz)}</span></div>
                    ${pharmacy ? `<div class="info-row"><span class="info-icon">${stk('pharmacy')}</span><span class="info-text">${uz ? 'Dorixona' : 'Аптека'}: ${esc(pharmacy.name || '')}</span></div>
                    <div class="info-row"><span class="info-icon">${stk('pin')}</span><span class="info-text">${esc(pharmacy.address || '')}</span></div>
                    <div class="info-row"><span class="info-icon">${stk('phone')}</span><span class="info-text">${esc(pharmacy.telefon || '')}</span></div>
                    ${pharmacy._km != null ? `<div class="info-row"><span class="info-icon">${stk('ruler')}</span><span class="info-text">${formatDistance(pharmacy._km)}</span></div>` : ''}` : ''}
                </div>
                ${bronTugmasi(drug, uz)}
                <div id="bronNatija"></div>`;
        }

        /** Mahsulot bron qilinadigan holatdami: hisob yuritilsa qoldiq bo'lishi shart. */
        function bronQilinadi(drug) {
            if (!drug || !drug.id) return false;
            if (drug.hisobYuritiladi) return (drug.qoldiq || 0) > 0;
            return drug.available !== false;
        }

        function bronTugmasi(drug, uz) {
            if (!bronQilinadi(drug)) return '';
            return `<button class="map-btn" style="background:linear-gradient(135deg,#66bb6a,#43a047);margin-top:1rem;"
                        onclick="bronTuriTanla(${drug.id}, '${esc(drug.name).replace(/'/g, "\\'")}')">
                        ${stk('basket')} ${uz ? 'Bron qilish' : 'Забронировать'}
                    </button>`;
        }

        function bronTuriTanla(doriId, nomi) {
            const uz = currentLang === 'uz';
            const natija = document.getElementById('bronNatija');
            natija.innerHTML = `
                <div style="margin-top:1rem;padding:1rem;border-radius:16px;background:rgba(56,189,248,0.1);border:1px solid rgba(56,189,248,0.3);">
                    <p style="margin:0 0 0.8rem;"><b>${uz ? 'Qanday olasiz?' : 'Как берёте?'}</b></p>
                    <div style="display:flex;gap:0.8rem;flex-wrap:wrap;">
                        <button class="map-btn" style="background:linear-gradient(135deg,#42a5f5,#1e88e5);flex:1;min-width:120px;"
                            onclick="bronSonKirit(${doriId}, '${esc(nomi).replace(/'/g, "\\'")}', 'DONA')">
                            ${stk('pill')} ${uz ? 'Dona' : 'Штука'}
                        </button>
                        <button class="map-btn" style="background:linear-gradient(135deg,#ab47bc,#8e24aa);flex:1;min-width:120px;"
                            onclick="bronSonKirit(${doriId}, '${esc(nomi).replace(/'/g, "\\'")}', 'PACHKA')">
                            ${stk('box')} ${uz ? 'Pachka' : 'Упаковка'}
                        </button>
                    </div>
                </div>`;
        }

        function bronSonKirit(doriId, nomi, turi) {
            const uz = currentLang === 'uz';
            const natija = document.getElementById('bronNatija');
            const turiNomi = turi === 'DONA' ? (uz ? 'dona' : 'штук') : (uz ? 'pachka' : 'упаковок');
            natija.innerHTML = `
                <div style="margin-top:1rem;padding:1rem;border-radius:16px;background:rgba(56,189,248,0.1);border:1px solid rgba(56,189,248,0.3);">
                    <p style="margin:0 0 0.8rem;"><b>${uz ? 'Nechta' : 'Сколько'} ${turiNomi}?</b></p>
                    <div style="display:flex;gap:0.8rem;align-items:center;">
                        <input type="number" id="bronSoniInput" min="1" value="1" style="
                            width:80px;padding:0.6rem 0.8rem;border-radius:12px;border:1px solid rgba(56,189,248,0.3);
                            background:rgba(0,0,0,0.3);color:var(--ink);font-size:1.1rem;text-align:center;font-family:inherit;">
                        <button class="map-btn" style="background:linear-gradient(135deg,#66bb6a,#43a047);flex:1;"
                            onclick="bronYubor(${doriId}, '${esc(nomi).replace(/'/g, "\\'")}', '${turi}')">
                            ${stk('check')} ${uz ? 'Tasdiqlash' : 'Подтвердить'}
                        </button>
                    </div>
                </div>`;
            setTimeout(function() { document.getElementById('bronSoniInput').focus(); }, 100);
        }

        async function bronYubor(doriId, nomi, turi) {
            const uz = currentLang === 'uz';
            const natija = document.getElementById('bronNatija');
            const soni = parseInt(document.getElementById('bronSoniInput').value, 10);
            if (!soni || soni <= 0) {
                natija.innerHTML = `<p style="color:#ff6b6b;">${uz ? 'Son noto\'g\'ri.' : 'Неверное количество.'}</p>`;
                return;
            }
            const turiNomi = turi === 'DONA' ? (uz ? 'dona' : 'шт.') : (uz ? 'pachka' : 'уп.');

            natija.innerHTML = `<p>${uz ? 'Yuborilmoqda…' : 'Отправка…'}</p>`;
            try {
                const r = await fetch('/api/bron', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + (localStorage.getItem('token') || '')
                    },
                    body: JSON.stringify({ doriId: doriId, soni: soni, turi: turi })
                });
                const data = await r.json();
                if (!r.ok) {
                    natija.innerHTML = `<p style="color:#ff6b6b;">${stk('cancel')} ${esc(data.xato || (uz ? 'Bron qilib bo\'lmadi' : 'Не удалось забронировать'))}</p>`;
                    return;
                }
                natija.innerHTML = `
                    <div style="margin-top:1rem;padding:1rem;border-radius:16px;background:rgba(102,187,106,0.15);border:1px solid #66bb6a;">
                        <p style="margin:0 0 0.5rem;"><b>${stk('check')} ${uz ? 'Bron qabul qilindi!' : 'Бронь принята!'}</b></p>
                        <p style="margin:0;">${uz ? 'Turi' : 'Тип'}: <b>${turiNomi}</b></p>
                        <p style="margin:0;">${uz ? 'Soni' : 'Количество'}: <b>${data.soni}</b></p>
                        ${data.narx ? `<p style="margin:0;">${uz ? 'Narxi' : 'Цена'}: <b>${data.narx.toLocaleString()} ${uz ? "so'm" : 'сум'}</b></p>` : ''}
                        <p style="margin:0;">${uz ? 'Olib ketish kodi' : 'Код получения'}: <b style="font-size:1.2rem;">${esc(data.kod)}</b></p>
                        <p style="margin:0.5rem 0 0;font-size:0.9rem;opacity:0.85;">
                            ${uz ? 'Dorixona tasdiqlaganda Telegram\'da xabar olasiz.'
                                 : 'Когда аптека подтвердит, вы получите сообщение в Telegram.'}
                        </p>
                    </div>`;
            } catch (e) {
                natija.innerHTML = `<p style="color:#ff6b6b;">${uz ? 'Serverga ulanib bo\'lmadi.' : 'Не удалось подключиться к серверу.'}</p>`;
            }
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
        }

        function closeModalOnOverlay(event) {
            if (event.target.id === 'modalOverlay') closeModal();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        setLang(currentLang);
        loadPharmacies();
    </script>
</body>
</html>
