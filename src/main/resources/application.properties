spring.application.name=Dori_Qidiruv_bot
server.port=${PORT:8080}
# Hosting proksisi (Railway/Render) ortida asl https sxemasi va domenni taniydi —
# aks holda o'z domenidan kelgan so'rovlar ham "Invalid CORS request" bilan rad etiladi.
server.forward-headers-strategy=framework

# Umumiy Postgres baza (bot va veb-sayt bir xil bazani ishlatadi).
# Render'da SPRING_DATASOURCE_URL/USERNAME/PASSWORD environment variable orqali beriladi
# (Spring Boot ularni avtomatik spring.datasource.*ga bog'laydi).
# Lokalda ishlash uchun standart qiymatlar (localhost Postgres) fallback sifatida beriladi.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dori_qidiruv_bot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
# Sxema: standart "update" (yangi jadval/ustunlarni o'zi qo'shadi, hech narsani o'chirmaydi).
# Prod'da tekshiruvsiz tezroq ishga tushirish uchun: SPRING_PROFILES_ACTIVE=prod (application-prod.properties).
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.jpa.open-in-view=false

# --- Ulanishlar va oqimlar ---
# Baza ulanishlari: bot ham shu Postgres'ni ishlatadi (Railway'da max_connections=100), shuning uchun pool kichik,
# lekin keshdan tashqari so'rovlar uchun yetarli. Ulanish 3 soniyada topilmasa so'rov xato bilan tez qaytadi
# (oqim cheksiz kutib qolmaydi).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:15}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:3}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1500000
# Tomcat: 64 ishchi oqim (har biri ~256 KB stek) — 15 ta baza ulanishiga mos; qolgan so'rovlar navbatda kutadi.
server.tomcat.threads.max=${TOMCAT_THREADS:64}
server.tomcat.threads.min-spare=8
server.tomcat.accept-count=500
server.tomcat.max-connections=4096
server.tomcat.connection-timeout=10s
# Bir JDBC so'rovi 10 soniyadan oshsa to'xtatiladi — bitta og'ir so'rov ulanishni band qilib qo'ymasin.
spring.jpa.properties.jakarta.persistence.query.timeout=10000
spring.jpa.properties.hibernate.jdbc.batch_size=500
# Xato javobida ichki tafsilot (stack trace, istisno matni) foydalanuvchiga chiqmasin.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# JWT Configuration
jwt.secret=${JWT_SECRET}
# Bir marta kirgach uzoq vaqt qayta kirish so'ralmaydi (365 kun).
jwt.expiration=31536000000

# Admin sifatida yozish huquqiga ega telefon raqamlar (vergul bilan ajratilgan).
# Solishtirishda faqat raqamlar hisobga olinadi, shuning uchun "+" va bo'shliqlar muhim emas.
app.admin-phones=${APP_ADMIN_PHONES:+998889863540}

# Statik fayllarni brauzer 1 soat keshlasin — qayta kirganda tezroq ochiladi.
# must-revalidate: muddati tugaganda serverdan tekshiradi, shuning uchun yangilanishlar ko'rinadi.

# Gzip siqish — sahifalar 3-5 baravar kichikroq yuklanadi
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,text/xml,text/plain
server.compression.min-response-size=1024

# Eskiz.uz SMS integratsiyasi (https://notify.eskiz.uz)
# email/password bo'sh bo'lsa, tizim test rejimida ishlaydi (kod faqat logga yoziladi)
eskiz.base-url=https://notify.eskiz.uz/api
eskiz.email=${ESKIZ_EMAIL:}
eskiz.password=${ESKIZ_PASSWORD:}
eskiz.from=4546

# Telegram bot orqali kod yuborish (D:\G59\boot loyihasidagi NotifyServer).
# Token bot.properties/.env (yoki Render'dagi INTERNAL_TOKEN environment variable) bilan bir xil bo'lishi kerak.
# Lokalda ishlashda standart qiymat (127.0.0.1) ishlatiladi; Render'da TELEGRAM_NOTIFY_URL
# environment variable orqali bot xizmatining ichki (private service) manziliga o'zgartiriladi.
# Standart qiymat - Render'dagi jonli bot manzili, shunda qo'shimcha sozlama shart emas.
# Lokalda ishlaganda TELEGRAM_NOTIFY_URL=http://127.0.0.1:8091/send-code qilib o'zgartiriladi.
telegram.notify.url=${TELEGRAM_NOTIFY_URL:https://dori-uzbot.onrender.com/send-code}
telegram.notify.token=${TELEGRAM_NOTIFY_TOKEN:}
# Dorixonalar boti tokeni (Railway: ${{Telegram_bot.BOT_TOKEN}}) — o'sha botdagi Mini App ham kodsiz kiradi.
telegram.extra-bot-tokens=${TELEGRAM_EXTRA_BOT_TOKENS:}
telegram.bot-username=dori_UzBot

# Fayl yuklash (to'lov cheki rasmi)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Logging
logging.level.com.example.dori_qidiruv_bot=INFO
logging.level.org.springframework.security=WARN

# CORS sozlamalari (vergul bilan ajratilgan). Bo'sh bo'lsa *.onrender.com va localhost ruxsat etiladi.
app.cors.allowed-origins=${APP_CORS_ORIGINS:}

# Keep-alive: faqat Render uchun edi (bepul reja uxlab qolmasligi uchun ping). Railway'da kerak emas —
# APP_KEEP_ALIVE_URL bo'sh bo'lsa yoki sayt Railway'da bo'lsa KeepAliveService umuman ishga tushmaydi.
app.keep-alive-url=${APP_KEEP_ALIVE_URL:}

# Dori yo'riqnomalarini yozuvchi sun'iy intellekt kaliti (DoriMalumotService). Bo'sh bo'lsa yozilmaydi.
anthropic.api-key=${ANTHROPIC_API_KEY:}
