spring.application.name=Dori_Qidiruv_bot
server.port=8080

# Umumiy Postgres baza (bot va veb-sayt bir xil bazani ishlatadi).
# Render'da SPRING_DATASOURCE_URL/USERNAME/PASSWORD environment variable orqali beriladi
# (Spring Boot ularni avtomatik spring.datasource.*ga bog'laydi).
# Lokalda ishlash uchun standart qiymatlar (localhost Postgres) fallback sifatida beriladi.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dori_qidiruv_bot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=2592000000

# Admin sifatida yozish huquqiga ega telefon raqamlar (vergul bilan ajratilgan).
# Solishtirishda faqat raqamlar hisobga olinadi, shuning uchun "+" va bo'shliqlar muhim emas.
app.admin-phones=${APP_ADMIN_PHONES:+998889863540}

# Statik fayllar (HTML/JS) keshlanmasin — aks holda brauzer eski nusxani ko'rsatib qoladi
# va yangilanishlar foydalanuvchiga yetib bormaydi.
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

# Eskiz.uz SMS integratsiyasi (https://notify.eskiz.uz)
# email/password bo'sh bo'lsa, tizim test rejimida ishlaydi (kod faqat logga yoziladi)
eskiz.base-url=https://notify.eskiz.uz/api
eskiz.email=${ESKIZ_EMAIL:}
eskiz.password=${ESKIZ_PASSWORD:}
eskiz.from=4546

# Telegram bot orqali kod yuborish (D:\G59\boot loyihasidagi NotifyServer).
# Token bot.properties/.env (yoki Render'dagi INTERNAL_TOKEN environment variable) bilan bir xil bo'lishi kerak.
# Lokalda ishlashda standart qiymat (127.0.0.1) ishlatiladi; Render'da TELEGRAM_NOTIFY_URL
# environment variable orqali bot xizmatining ichki (private service) manziliga o'zgartiriladi.
# Standart qiymat - Render'dagi jonli bot manzili, shunda qo'shimcha sozlama shart emas.
# Lokalda ishlaganda TELEGRAM_NOTIFY_URL=http://127.0.0.1:8091/send-code qilib o'zgartiriladi.
telegram.notify.url=${TELEGRAM_NOTIFY_URL:https://dori-uzbot.onrender.com/send-code}
telegram.notify.token=${TELEGRAM_NOTIFY_TOKEN}
telegram.bot-username=dori_UzBot

# Fayl yuklash (to'lov cheki rasmi)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Logging
logging.level.com.example.dori_qidiruv_bot=INFO
logging.level.org.springframework.security=WARN

# CORS sozlamalari (vergul bilan ajratilgan). Bo'sh bo'lsa *.onrender.com va localhost ruxsat etiladi.
app.cors.allowed-origins=${APP_CORS_ORIGINS:}

# Keep-alive: Render free tier uxlab qolmasligi uchun har 14 daqiqada o'ziga ping yuboradi.
# Render'da APP_KEEP_ALIVE_URL=https://dori-qidiruv-bot-sayt.onrender.com/api/health qo'yiladi.
app.keep-alive-url=${APP_KEEP_ALIVE_URL:}