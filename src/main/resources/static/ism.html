<!DOCTYPE html>
<html lang="uz">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="auth-guard.js"></script>
    <script src="stickers.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ism kiriting - Dori Qidiruv</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: #03100D;
            min-height: 100vh;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .name-container {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: wave 2s ease-in-out infinite;
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(20deg); }
            75% { transform: rotate(-20deg); }
        }

        .app-name {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(140deg, #3AE0BC, #16C6A4 55%, #0E6B5C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 3rem;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 3rem 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 2.5rem;
            font-size: 0.95rem;
        }

        .name-input {
            width: 100%;
            padding: 1.2rem 1.5rem;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s;
            margin-bottom: 2rem;
        }

        .name-input:focus {
            border-color: #16C6A4;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(22, 198, 164, 0.3);
        }

        .name-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .submit-btn {
            width: 100%;
            padding: 1.2rem;
            border: none;
            background: linear-gradient(140deg, #3AE0BC, #16C6A4 55%, #0E6B5C);
            color: white;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(22, 198, 164, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .lang-switch {
            display: flex;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.3rem;
            border-radius: 20px;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .lang-btn {
            padding: 0.4rem 1rem;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .lang-btn.active {
            background: linear-gradient(140deg, #3AE0BC, #16C6A4 55%, #0E6B5C);
            color: white;
        }

        @media (max-width: 480px) {
            .glass-card {
                padding: 2.5rem 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }
        }

        /* ============================================================
           Suyuq shisha — bosh sahifa bilan bir xil chuqurlik va fon.
           Quyidagi qoidalar yuqoridagilarni to'ldiradi.
           ============================================================ */
        .aurora {
            position: fixed; inset: 0; z-index: -1; overflow: hidden;
            background:
                radial-gradient(1100px 700px at 50% -12%, #0F3B34 0%, transparent 62%),
                linear-gradient(180deg, #061815 0%, #03100D 58%);
        }
        .aurora span {
            position: absolute; display: block; border-radius: 50%;
            filter: blur(80px); opacity: 0.85; will-change: transform;
        }
        .aurora span:nth-child(1) {
            width: 46vw; height: 46vw; min-width: 320px; min-height: 320px;
            left: -10vw; top: -8vw;
            background: radial-gradient(circle, #12907A, transparent 68%);
            animation: suzish-a 26s cubic-bezier(0.4,0,0.2,1) infinite alternate;
        }
        .aurora span:nth-child(2) {
            width: 40vw; height: 40vw; min-width: 280px; min-height: 280px;
            right: -8vw; bottom: -6vw;
            background: radial-gradient(circle, #0D6C7A, transparent 68%);
            animation: suzish-b 32s cubic-bezier(0.4,0,0.2,1) infinite alternate;
        }
        @keyframes suzish-a { to { transform: translate3d(9vw, 7vh, 0) scale(1.14); } }
        @keyframes suzish-b { to { transform: translate3d(-8vw, -9vh, 0) scale(1.1); } }

        /* Shishaning qalinligi: tepa qirrasida yorug'lik, chekkasida sinish halqasi */
        .glass-card {
            position: relative;
            background: linear-gradient(160deg,
                rgba(255,255,255,0.095) 0%, rgba(255,255,255,0.055) 42%, rgba(255,255,255,0.03) 100%);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            border: none;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.30),
                inset 0 -1px 0 rgba(255,255,255,0.05),
                inset 0 0 30px rgba(255,255,255,0.035),
                0 18px 50px rgba(0,0,0,0.5),
                0 3px 10px rgba(0,0,0,0.32);
        }
        .glass-card::after {
            content: ''; position: absolute; inset: 0;
            border-radius: inherit; padding: 1px;
            background: linear-gradient(145deg,
                rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.08) 26%,
                rgba(255,255,255,0) 52%, rgba(255,255,255,0.06) 74%, rgba(255,255,255,0.22) 100%);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
            pointer-events: none;
        }

        /* Yorqin ko'kimtir-yashil fonda oq matn o'qilmaydi — to'q rang qo'yamiz */
        .submit-btn, .lang-btn.active, .logout-btn { color: #04211C; }

        .submit-btn, .logout-btn {
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 6px 20px rgba(22,198,164,0.3);
            font-family: inherit;
        }
        .submit-btn:hover, .logout-btn:hover { filter: brightness(1.06); }

        .country-select option { background: #08211C; color: #E9F3F0; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        :focus-visible { outline: 2px solid #16C6A4; outline-offset: 3px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="aurora" aria-hidden="true"><span></span><span></span></div>

    <div class="name-container">
        <div class="logo"><img class="stk" style="width:4.2rem;height:4.2rem" data-stk="user" alt="" src="icons/user.png" onerror="stkFallback(this)"></div>
        <div class="app-name">Dori Qidiruv</div>
        
        <div class="glass-card">
            <div class="lang-switch">
                <button type="button" class="lang-btn active" data-lang="uz" onclick="setLang('uz')">UZ</button>
                <button type="button" class="lang-btn" data-lang="ru" onclick="setLang('ru')">RU</button>
            </div>

            <h1 data-uz="Ismingizni kiriting" data-ru="Введите ваше имя">Ismingizni kiriting</h1>
            <p class="subtitle" data-uz="Sizni qanday chaqiramiz?" data-ru="Как мы можем к вам обращаться?">Sizni qanday chaqiramiz?</p>
            
            <form id="nameForm" onsubmit="handleSubmit(event)">
                <input 
                    type="text" 
                    class="name-input" 
                    id="nameInput" 
                    placeholder="Ismingiz..."
                    data-placeholder-uz="Ismingiz..."
                    data-placeholder-ru="Ваше имя..."
                    autocomplete="off"
                    required
                >
                <p class="error-message" id="errorMessage" data-uz="Iltimos, ismingizni kiriting" data-ru="Пожалуйста, введите ваше имя">Iltimos, ismingizni kiriting</p>
                
                <button type="submit" class="submit-btn" id="submitBtn" data-uz="Davom etish" data-ru="Продолжить">Davom etish</button>
            </form>
        </div>
    </div>

    <script>
        // Til tanlovi oldingi sahifalardan shu yerga ham o'tadi.
        let currentLang = localStorage.getItem('lang') || 'uz';

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            document.documentElement.lang = lang;

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
            });

            document.querySelectorAll('[data-uz]').forEach(el => {
                el.textContent = el.getAttribute('data-' + lang);
            });

            // Placeholder alohida belgilanadi: bunday maydonlarda data-uz bo'lmaydi,
            // shuning uchun ular yuqoridagi aylanishga tushmay qolardi.
            document.querySelectorAll('[data-placeholder-uz]').forEach(el => {
                el.placeholder = el.getAttribute('data-placeholder-' + lang);
            });
        }

        const nameInput = document.getElementById('nameInput');
        const errorMessage = document.getElementById('errorMessage');
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = 'login.html';
        } else {
            fetch('/api/auth/profile', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
                .then(response => response.ok ? response.json() : Promise.reject())
                .then(user => {
                    if (user.name && user.name.trim().length >= 2) {
                        window.location.href = 'index.html';
                    }
                })
                .catch(() => { /* profilni olib bo'lmadi - foydalanuvchi ismini shu yerda kiritadi */ });
        }

        nameInput.addEventListener('input', () => {
            errorMessage.classList.remove('show');
        });

        async function handleSubmit(e) {
            e.preventDefault();

            const name = nameInput.value.trim();

            if (name.length < 2) {
                errorMessage.textContent = currentLang === 'uz'
                    ? 'Iltimos, to\'liq ismingizni kiriting'
                    : 'Пожалуйста, введите ваше полное имя';
                errorMessage.classList.add('show');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = currentLang === 'uz' ? 'Saqlanmoqda...' : 'Сохранение...';

            try {
                const response = await fetch('/api/auth/profile', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ name })
                });

                if (!response.ok) {
                    errorMessage.textContent = currentLang === 'uz' ? 'Xatolik yuz berdi' : 'Произошла ошибка';
                    errorMessage.classList.add('show');
                    submitBtn.disabled = false;
                    submitBtn.textContent = currentLang === 'uz' ? 'Davom etish' : 'Продолжить';
                    return;
                }

                localStorage.setItem('userName', name);
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'index.html';
            } catch (error) {
                errorMessage.textContent = currentLang === 'uz'
                    ? 'Serverga ulanib bo\'lmadi. Qayta urinib ko\'ring.'
                    : 'Не удалось подключиться к серверу. Попробуйте снова.';
                errorMessage.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.textContent = currentLang === 'uz' ? 'Davom etish' : 'Продолжить';
            }
        }

        setLang(currentLang);
        nameInput.focus();
    </script>
</body>
</html>
