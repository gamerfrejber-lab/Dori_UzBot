<!DOCTYPE html>
<html lang="uz">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dorixonalar - Dori Qidiruv</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #0d1b3e 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        header {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4fc3f7, #7c4dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        nav a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #4fc3f7;
        }

        .lang-switch {
            display: flex;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.3rem;
            border-radius: 20px;
        }

        .lang-btn {
            padding: 0.3rem 0.8rem;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, #4fc3f7, #7c4dff);
            color: white;
        }

        .profile-btn {
            padding: 0.6rem 1.5rem;
            border: none;
            background: linear-gradient(135deg, #4fc3f7, #7c4dff);
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
        }

        .profile-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(79, 195, 247, 0.4);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-title {
            text-align: center;
            font-size: 2.5rem;
            margin: 2rem 0;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 3rem;
            font-size: 1.1rem;
        }

        .pharmacies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            transition: all 0.3s;
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(79, 195, 247, 0.2);
        }

        .pharmacy-card h3 {
            font-size: 1.4rem;
            margin-bottom: 1rem;
            color: #7c4dff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .pharmacy-info {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .info-row {
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.5;
        }

        .info-icon {
            font-size: 1.2rem;
            min-width: 24px;
        }

        .info-text {
            flex: 1;
        }

        .map-btn {
            margin-top: 1rem;
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #4fc3f7;
            background: rgba(79, 195, 247, 0.1);
            color: #4fc3f7;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .map-btn:hover {
            background: rgba(79, 195, 247, 0.2);
            transform: translateY(-2px);
        }

        .pharmacy-card {
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            z-index: 200;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: #101a33;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 2rem;
            width: 100%;
            max-width: 560px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal h2 {
            color: #7c4dff;
            margin-bottom: 1.2rem;
            padding-right: 2rem;
        }

        .modal-close {
            float: right;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.6rem;
            cursor: pointer;
            line-height: 1;
        }

        .modal-close:hover {
            color: #fff;
        }

        .drug-list {
            margin-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1.2rem;
        }

        .drug-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            padding: 0.7rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .drug-row:last-child {
            border-bottom: none;
        }

        .drug-clickable {
            cursor: pointer;
            border-radius: 10px;
            padding-left: 0.5rem;
            padding-right: 0.5rem;
            transition: background 0.2s;
        }

        .drug-clickable:hover {
            background: rgba(79, 195, 247, 0.12);
        }

        .back-btn {
            background: transparent;
            border: none;
            color: #4fc3f7;
            cursor: pointer;
            font-size: 0.95rem;
            padding: 0;
            margin-bottom: 0.8rem;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

        .drug-name {
            font-weight: 600;
        }

        .drug-manufacturer {
            display: block;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .drug-price {
            color: #4fc3f7;
            font-weight: 600;
            white-space: nowrap;
        }

        .drug-out {
            color: #ff6b6b;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .loading {
            text-align: center;
            padding: 4rem 2rem;
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4rem;
        }

        @media (max-width: 768px) {
            .header-content {
                flex-wrap: wrap;
                gap: 1rem;
            }

            nav {
                gap: 1rem;
                font-size: 0.9rem;
            }

            .page-title {
                font-size: 2rem;
            }

            .pharmacies-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">💊 Dori Qidiruv</div>
            <nav>
                <a href="index.html" data-uz="Bosh sahifa" data-ru="Главная">Bosh sahifa</a>
                <a href="dorixonalar.html" data-uz="Dorixonalar" data-ru="Аптеки">Dorixonalar</a>
                <div class="lang-switch">
                    <button class="lang-btn active" onclick="setLang('uz')">UZ</button>
                    <button class="lang-btn" onclick="setLang('ru')">RU</button>
                </div>
                <a href="profil.html" class="profile-btn" id="profileBtn" data-uz="Profil" data-ru="Профиль">Kirish</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title" data-uz="🏥 Barcha Dorixonalar" data-ru="🏥 Все Аптеки">🏥 Barcha Dorixonalar</h1>
        <p class="subtitle" data-uz="Yaqin atrofdagi dorixonalarni toping" data-ru="Найдите ближайшие аптеки">Yaqin atrofdagi dorixonalarni toping</p>
        
        <div id="pharmaciesContainer">
            <div class="loading" data-uz="Yuklanmoqda" data-ru="Загрузка">Yuklanmoqda</div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
        <div class="modal" id="modalBox"></div>
    </div>

    <footer>
        <p data-uz="© 2024 Dori Qidiruv. Barcha huquqlar himoyalangan." data-ru="© 2024 Поиск лекарств. Все права защищены.">© 2024 Dori Qidiruv. Barcha huquqlar himoyalangan.</p>
    </footer>

    <script>
        // Kirish nazorati auth-guard.js'da (Mini App avtomatik kirishi bilan birga) bajariladi.

        let currentLang = 'uz';
        let userLocation = null;

        /** Brauzerdan joriy lokatsiyani so'raydi. Ruxsat berilmasa null qaytadi. */
        function requestLocation() {
            return new Promise(resolve => {
                if (!navigator.geolocation) return resolve(null);
                navigator.geolocation.getCurrentPosition(
                    pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
                    () => resolve(null),
                    { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
                );
            });
        }

        /** Ikki koordinata orasidagi masofa (km) — Haversine formulasi. */
        function distanceKm(lat1, lon1, lat2, lon2) {
            const toRad = deg => deg * Math.PI / 180;
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat / 2) ** 2
                + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
            return 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function formatDistance(km) {
            return km < 1
                ? `${Math.round(km * 1000)} ${currentLang === 'uz' ? 'm' : 'м'}`
                : `${km.toFixed(1)} ${currentLang === 'uz' ? 'km' : 'км'}`;
        }

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            document.querySelectorAll('[data-uz]').forEach(el => {
                el.textContent = el.getAttribute('data-' + lang);
            });
        }

        // Bu sahifaga faqat token bilan kirilgani uchun profil tugmasi doim profilga olib boradi.
        const profileBtn = document.getElementById('profileBtn');
        profileBtn.href = 'profil.html';
        profileBtn.textContent = localStorage.getItem('userName')
            || (currentLang === 'uz' ? 'Profil' : 'Профиль');

        async function loadPharmacies() {
            userLocation = await requestLocation();
            try {
                const response = await fetch('/api/dorixona');
                const data = await response.json();
                displayPharmacies(sortByDistance(data));
            } catch (error) {
                console.log('API unavailable', error);
                document.getElementById('pharmaciesContainer').innerHTML =
                    `<p class="subtitle">${currentLang === 'uz'
                        ? 'Dorixonalarni yuklab bo\'lmadi. Keyinroq urinib ko\'ring.'
                        : 'Не удалось загрузить аптеки. Попробуйте позже.'}</p>`;
            }
        }

        let loadedPharmacies = [];
        let loadedDrugs = [];
        let currentPharmacyIndex = null;

        function esc(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        /** Dorixonalarni foydalanuvchiga eng yaqinidan boshlab tartiblaydi va masofani qo'shadi. */
        function sortByDistance(pharmacies) {
            if (!userLocation || !Array.isArray(pharmacies)) return pharmacies;
            return pharmacies
                .map(ph => ({
                    ...ph,
                    _km: ph.latitude && ph.longitude
                        ? distanceKm(userLocation.lat, userLocation.lon, ph.latitude, ph.longitude)
                        : null
                }))
                .sort((a, b) => (a._km ?? Infinity) - (b._km ?? Infinity));
        }

        function displayPharmacies(pharmacies) {
            const container = document.getElementById('pharmaciesContainer');

            if (!pharmacies || pharmacies.length === 0) {
                container.innerHTML = '<p class="subtitle">Dorixonalar topilmadi 😔</p>';
                return;
            }

            // Lokatsiya berilgan bo'lsa sarlavhani "eng yaqin" deb yangilaymiz
            if (userLocation) {
                const title = document.querySelector('.page-title');
                if (title) title.textContent = currentLang === 'uz'
                    ? '🏥 Menga yaqin dorixonalar'
                    : '🏥 Ближайшие аптеки';
            }

            loadedPharmacies = pharmacies;
            const grid = document.createElement('div');
            grid.className = 'pharmacies-grid';

            grid.innerHTML = pharmacies.map((pharmacy, index) => {
                const hasLocation = pharmacy.latitude && pharmacy.longitude;
                return `
                <div class="glass-card pharmacy-card" onclick="openPharmacy(${index})">
                    <h3>🏥 ${esc(pharmacy.nomi || pharmacy.name)}</h3>
                    <div class="pharmacy-info">
                        <div class="info-row">
                            <span class="info-icon">📍</span>
                            <span class="info-text">${esc(pharmacy.manzil || pharmacy.address)}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-icon">📞</span>
                            <span class="info-text">${esc(pharmacy.telefon || pharmacy.phone)}</span>
                        </div>
                        ${pharmacy._km != null ? `<div class="info-row">
                            <span class="info-icon">📏</span>
                            <span class="info-text">${formatDistance(pharmacy._km)}</span>
                        </div>` : ''}
                    </div>
                    ${hasLocation ? `<button class="map-btn" onclick="showOnMap(event, ${index})">
                        ${currentLang === 'uz' ? '📍 Xaritada ko\'rish' : '📍 Показать на карте'}
                    </button>` : ''}
                </div>`;
            }).join('');

            container.innerHTML = '';
            container.appendChild(grid);
        }

        function showOnMap(event, index) {
            event.stopPropagation();
            const pharmacy = loadedPharmacies[index];
            if (!pharmacy || !pharmacy.latitude || !pharmacy.longitude) return;
            window.open(`https://yandex.com/maps/?pt=${pharmacy.longitude},${pharmacy.latitude}&z=17&l=map`, '_blank');
        }

        async function openPharmacy(index) {
            const pharmacy = loadedPharmacies[index];
            if (!pharmacy) return;
            currentPharmacyIndex = index;

            const overlay = document.getElementById('modalOverlay');
            const box = document.getElementById('modalBox');
            const name = esc(pharmacy.nomi || pharmacy.name);

            box.innerHTML = `
                <button class="modal-close" onclick="closeModal()">&times;</button>
                <h2>🏥 ${name}</h2>
                <div class="pharmacy-info">
                    <div class="info-row"><span class="info-icon">📍</span><span class="info-text">${esc(pharmacy.manzil || pharmacy.address)}</span></div>
                    <div class="info-row"><span class="info-icon">📞</span><span class="info-text">${esc(pharmacy.telefon || pharmacy.phone)}</span></div>
                </div>
                <div class="drug-list"><p class="subtitle">${currentLang === 'uz' ? 'Dorilar yuklanmoqda...' : 'Загрузка лекарств...'}</p></div>`;
            overlay.classList.add('show');

            if (!pharmacy.id) return;
            try {
                const response = await fetch(`/api/dorixona/${pharmacy.id}/dorilar`);
                loadedDrugs = response.ok ? await response.json() : [];
                box.querySelector('.drug-list').innerHTML = renderDrugs(loadedDrugs);
            } catch (error) {
                box.querySelector('.drug-list').innerHTML =
                    `<p class="subtitle">${currentLang === 'uz' ? 'Dorilarni yuklab bo\'lmadi' : 'Не удалось загрузить лекарства'}</p>`;
            }
        }

        function renderDrugs(drugs) {
            if (!drugs || drugs.length === 0) {
                return `<p class="subtitle">${currentLang === 'uz' ? 'Bu dorixonada hozircha dori yo\'q' : 'В этой аптеке пока нет лекарств'}</p>`;
            }
            const title = currentLang === 'uz' ? `💊 Dorilar (${drugs.length})` : `💊 Лекарства (${drugs.length})`;
            const rows = drugs.map((drug, i) => {
                const drugName = currentLang === 'ru' && drug.nameRu ? drug.nameRu : drug.name;
                const price = (drug.price || 0).toLocaleString();
                const status = drug.available
                    ? `<span class="drug-price">${price} ${currentLang === 'uz' ? 'so\'m' : 'сум'}</span>`
                    : `<span class="drug-out">${currentLang === 'uz' ? 'Mavjud emas' : 'Нет в наличии'}</span>`;
                return `<div class="drug-row drug-clickable" onclick="openDrug(${i})">
                    <span><span class="drug-name">${esc(drugName)}</span>
                    <span class="drug-manufacturer">${esc(drug.manufacturer || '')}</span></span>
                    ${status}
                </div>`;
            }).join('');
            return `<h3 style="margin-bottom:0.8rem;">${title}</h3>${rows}`;
        }

        /** Dori qatori bosilganda o'sha dori haqida to'liq ma'lumotni ko'rsatadi. */
        function openDrug(index) {
            const drug = loadedDrugs[index];
            const pharmacy = loadedPharmacies[currentPharmacyIndex];
            if (!drug) return;
            const uz = currentLang === 'uz';
            const box = document.getElementById('modalBox');
            const drugName = currentLang === 'ru' && drug.nameRu ? drug.nameRu : drug.name;

            box.innerHTML = `
                <button class="modal-close" onclick="closeModal()">&times;</button>
                <button class="back-btn" onclick="openPharmacy(${currentPharmacyIndex})">${uz ? '← Orqaga' : '← Назад'}</button>
                <h2>💊 ${esc(drugName)}</h2>
                <div class="pharmacy-info">
                    ${drug.name ? `<div class="info-row"><span class="info-icon">🔤</span><span class="info-text">${uz ? 'Nomi' : 'Название'}: ${esc(drug.name)}</span></div>` : ''}
                    ${drug.nameRu ? `<div class="info-row"><span class="info-icon">🇷🇺</span><span class="info-text">${uz ? 'Ruscha nomi' : 'На русском'}: ${esc(drug.nameRu)}</span></div>` : ''}
                    <div class="info-row"><span class="info-icon">🏭</span><span class="info-text">${uz ? 'Ishlab chiqaruvchi' : 'Производитель'}: ${esc(drug.manufacturer || '—')}</span></div>
                    <div class="info-row"><span class="info-icon">💵</span><span class="info-text">${uz ? 'Narxi' : 'Цена'}: <b>${(drug.price || 0).toLocaleString()} ${uz ? "so'm" : 'сум'}</b></span></div>
                    <div class="info-row"><span class="info-icon">📦</span><span class="info-text">${uz ? 'Holat' : 'Статус'}: ${drug.available
                        ? (uz ? '🟢 Mavjud' : '🟢 В наличии')
                        : (uz ? '🔴 Mavjud emas' : '🔴 Нет в наличии')}</span></div>
                    ${pharmacy ? `<div class="info-row"><span class="info-icon">🏥</span><span class="info-text">${uz ? 'Dorixona' : 'Аптека'}: ${esc(pharmacy.name || '')}</span></div>
                    <div class="info-row"><span class="info-icon">📍</span><span class="info-text">${esc(pharmacy.address || '')}</span></div>
                    <div class="info-row"><span class="info-icon">📞</span><span class="info-text">${esc(pharmacy.telefon || '')}</span></div>
                    ${pharmacy._km != null ? `<div class="info-row"><span class="info-icon">📏</span><span class="info-text">${formatDistance(pharmacy._km)}</span></div>` : ''}` : ''}
                </div>`;
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
        }

        function closeModalOnOverlay(event) {
            if (event.target.id === 'modalOverlay') closeModal();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        loadPharmacies();
    </script>
</body>
</html>
