<!DOCTYPE html>
<html lang="uz">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="auth-guard.js"></script>
    <script src="stickers.js"></script>
    <script src="swipe.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - Dori Qidiruv</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: #03100D;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        header {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(140deg, #3AE0BC, #16C6A4 55%, #0E6B5C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        nav a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #16C6A4;
        }

        .lang-switch {
            display: flex;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.3rem;
            border-radius: 20px;
        }

        .lang-btn {
            padding: 0.3rem 0.8rem;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .lang-btn.active {
            background: linear-gradient(140deg, #3AE0BC, #16C6A4 55%, #0E6B5C);
            color: white;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .profile-container {
            margin-top: 2rem;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .avatar {
            width: 120px;
            height: 120px;
            background: linear-gradient(140deg, #3AE0BC, #16C6A4 55%, #0E6B5C);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            margin: 0 auto 1.5rem;
            box-shadow: 0 10px 40px rgba(22, 198, 164, 0.4);
        }

        .user-name {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .user-phone {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.1rem;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s;
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .card-title {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: #16C6A4;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.8rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: rgba(255, 255, 255, 0.6);
        }

        .info-value {
            color: #fff;
            font-weight: 600;
        }

        .logout-btn {
            width: 100%;
            padding: 1.2rem;
            border: 2px solid #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            color: #ff6b6b;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 2rem;
        }

        .logout-btn:hover {
            background: rgba(255, 107, 107, 0.2);
            transform: translateY(-2px);
        }

        .login-prompt {
            text-align: center;
            padding: 4rem 2rem;
        }

        .login-prompt h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .login-prompt p {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 2rem;
        }

        .login-link {
            padding: 1.2rem 3rem;
            border: none;
            background: linear-gradient(140deg, #3AE0BC, #16C6A4 55%, #0E6B5C);
            color: white;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }

        .login-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(22, 198, 164, 0.4);
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4rem;
        }

        @media (max-width: 768px) {
            .header-content {
                flex-wrap: wrap;
                gap: 1rem;
            }

            nav {
                gap: 1rem;
                font-size: 0.9rem;
            }

            .user-name {
                font-size: 2rem;
            }

            .avatar {
                width: 100px;
                height: 100px;
                font-size: 3.5rem;
            }
        }

        /* ============================================================
           Suyuq shisha — bosh sahifa bilan bir xil chuqurlik va fon.
           Quyidagi qoidalar yuqoridagilarni to'ldiradi.
           ============================================================ */
        .aurora {
            position: fixed; inset: 0; z-index: -1; overflow: hidden;
            background:
                radial-gradient(1100px 700px at 50% -12%, #0F3B34 0%, transparent 62%),
                linear-gradient(180deg, #061815 0%, #03100D 58%);
        }
        .aurora span {
            position: absolute; display: block; border-radius: 50%;
            filter: blur(80px); opacity: 0.85; will-change: transform;
        }
        .aurora span:nth-child(1) {
            width: 46vw; height: 46vw; min-width: 320px; min-height: 320px;
            left: -10vw; top: -8vw;
            background: radial-gradient(circle, #12907A, transparent 68%);
            animation: suzish-a 26s cubic-bezier(0.4,0,0.2,1) infinite alternate;
        }
        .aurora span:nth-child(2) {
            width: 40vw; height: 40vw; min-width: 280px; min-height: 280px;
            right: -8vw; bottom: -6vw;
            background: radial-gradient(circle, #0D6C7A, transparent 68%);
            animation: suzish-b 32s cubic-bezier(0.4,0,0.2,1) infinite alternate;
        }
        @keyframes suzish-a { to { transform: translate3d(9vw, 7vh, 0) scale(1.14); } }
        @keyframes suzish-b { to { transform: translate3d(-8vw, -9vh, 0) scale(1.1); } }

        /* Shishaning qalinligi: tepa qirrasida yorug'lik, chekkasida sinish halqasi */
        .glass-card {
            position: relative;
            background: linear-gradient(160deg,
                rgba(255,255,255,0.095) 0%, rgba(255,255,255,0.055) 42%, rgba(255,255,255,0.03) 100%);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            border: none;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.30),
                inset 0 -1px 0 rgba(255,255,255,0.05),
                inset 0 0 30px rgba(255,255,255,0.035),
                0 18px 50px rgba(0,0,0,0.5),
                0 3px 10px rgba(0,0,0,0.32);
        }
        .glass-card::after {
            content: ''; position: absolute; inset: 0;
            border-radius: inherit; padding: 1px;
            background: linear-gradient(145deg,
                rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.08) 26%,
                rgba(255,255,255,0) 52%, rgba(255,255,255,0.06) 74%, rgba(255,255,255,0.22) 100%);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
            pointer-events: none;
        }

        /* Yorqin ko'kimtir-yashil fonda oq matn o'qilmaydi — to'q rang qo'yamiz */
        .submit-btn, .lang-btn.active, .logout-btn { color: #04211C; }

        .submit-btn, .logout-btn {
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 6px 20px rgba(22,198,164,0.3);
            font-family: inherit;
        }
        .submit-btn:hover, .logout-btn:hover { filter: brightness(1.06); }

        .country-select option { background: #08211C; color: #E9F3F0; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        :focus-visible { outline: 2px solid #16C6A4; outline-offset: 3px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="aurora" aria-hidden="true"><span></span><span></span></div>

    <header>
        <div class="header-content">
            <div class="logo"><img class="stk" data-stk="pill" alt="" src="icons/pill.png" onerror="stkFallback(this)"> Dori Qidiruv</div>
            <nav>
                <a href="index.html" data-uz="Bosh sahifa" data-ru="Главная">Bosh sahifa</a>
                <a href="dorixonalar.html" data-uz="Dorixonalar" data-ru="Аптеки">Dorixonalar</a>
                <div class="lang-switch">
                    <button type="button" class="lang-btn active" data-lang="uz" onclick="setLang('uz')">UZ</button>
                    <button type="button" class="lang-btn" data-lang="ru" onclick="setLang('ru')">RU</button>
                </div>
            </nav>
        </div>
    </header>

    <div class="container">
        <div id="profileContent"></div>
    </div>

    <footer>
        <p data-uz="Dori Qidiruv — dorini topish va oldindan band qilish xizmati" data-ru="Dori Qidiruv — сервис поиска и брони лекарств">Dori Qidiruv — dorini topish va oldindan band qilish xizmati</p>
    </footer>

    <script>
        // Til tanlovi barcha sahifalarda bir xil saqlanadi (kirish sahifasidan boshlab).
        let currentLang = localStorage.getItem('lang') || 'uz';

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            document.documentElement.lang = lang;

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
            });

            document.querySelectorAll('[data-uz]').forEach(el => {
                el.textContent = el.getAttribute('data-' + lang);
            });
        }

        const token = localStorage.getItem('token');
        const profileContent = document.getElementById('profileContent');

        if (token) {
            fetch('/api/auth/profile', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
                .then(response => response.ok ? response.json() : Promise.reject())
                .then(user => displayProfile(user))
                .catch(() => {
                    localStorage.removeItem('token');
                    displayLoginPrompt();
                });
        } else {
            displayLoginPrompt();
        }

        function displayProfile(user) {
            const userName = user.name || (currentLang === 'uz' ? 'Foydalanuvchi' : 'Пользователь');
            const userPhone = user.phoneNumber || '';
            const joinDate = user.createdAt
                ? new Date(user.createdAt).toLocaleDateString('uz-UZ', { year: 'numeric', month: 'long', day: 'numeric' })
                : new Date().toLocaleDateString('uz-UZ', { year: 'numeric', month: 'long', day: 'numeric' });

            profileContent.innerHTML = `
                <div class="profile-container">
                    <div class="profile-header">
                        <div class="avatar">👤</div>
                        <h1 class="user-name">${userName}</h1>
                        <p class="user-phone">${userPhone}</p>
                    </div>

                    <div class="glass-card">
                        <h3 class="card-title">📋 <span data-uz="Shaxsiy ma'lumotlar" data-ru="Личные данные">${currentLang === 'uz' ? 'Shaxsiy ma\'lumotlar' : 'Личные данные'}</span></h3>
                        <div class="info-row">
                            <span class="info-label" data-uz="Ism" data-ru="Имя">${currentLang === 'uz' ? 'Ism' : 'Имя'}</span>
                            <span class="info-value">${userName}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label" data-uz="Telefon" data-ru="Телефон">${currentLang === 'uz' ? 'Telefon' : 'Телефон'}</span>
                            <span class="info-value">${userPhone}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label" data-uz="Ro'yxatdan o'tgan" data-ru="Зарегистрирован">${currentLang === 'uz' ? 'Ro\'yxatdan o\'tgan' : 'Зарегистрирован'}</span>
                            <span class="info-value">${joinDate}</span>
                        </div>
                    </div>

                    <div class="glass-card">
                        <h3 class="card-title">🛒 <span>${currentLang === 'uz' ? 'Mening bronlarim' : 'Мои брони'}</span></h3>
                        <div id="bronlarim">
                            <p style="opacity:0.7;">${currentLang === 'uz' ? 'Yuklanmoqda…' : 'Загрузка…'}</p>
                        </div>
                    </div>

                    <button class="logout-btn" onclick="logout()">
                        <span data-uz="🚪 Chiqish" data-ru="🚪 Выйти">${currentLang === 'uz' ? '🚪 Chiqish' : '🚪 Выйти'}</span>
                    </button>
                </div>
            `;
            bronlarniYukla();
        }

        /** Foydalanuvchining bronlari — holati va olib ketish kodi bilan. */
        async function bronlarniYukla() {
            const uz = currentLang === 'uz';
            const box = document.getElementById('bronlarim');
            if (!box) return;
            try {
                const r = await fetch('/api/bron/meniki', {
                    headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('token') || '') }
                });
                if (!r.ok) throw new Error('xato');
                const bronlar = await r.json();
                if (!bronlar.length) {
                    box.innerHTML = `<p style="opacity:0.7;">${uz
                        ? 'Hozircha bron yo\'q. Dori qidirib, kartasidagi «Bron qilish» tugmasini bosing.'
                        : 'Пока броней нет. Найдите лекарство и нажмите «Забронировать».'}</p>`;
                    return;
                }
                box.innerHTML = bronlar.map(b => `
                    <div style="padding:0.9rem 0;border-bottom:1px solid rgba(255,255,255,0.08);">
                        <div style="display:flex;justify-content:space-between;gap:0.5rem;flex-wrap:wrap;">
                            <b>${stk('pill')} ${esc(b.doriNomi)}</b>
                            <span>${bronHolati(b.holat, uz)}</span>
                        </div>
                        <div style="opacity:0.8;font-size:0.92rem;margin-top:0.25rem;">
                            🏥 ${esc(b.dorixonaNomi || '')}${b.manzil ? ' · 📍 ' + esc(b.manzil) : ''}
                        </div>
                        <div style="opacity:0.8;font-size:0.92rem;">
                            ${uz ? 'Soni' : 'Кол-во'}: <b>${b.soni}</b> ${uz ? 'ta' : 'шт.'}
                            · ${uz ? 'Kod' : 'Код'}: <b>${esc(b.kod || '—')}</b>
                        </div>
                    </div>`).join('');
            } catch (e) {
                box.innerHTML = `<p style="opacity:0.7;">${uz
                    ? 'Bronlarni yuklab bo\'lmadi.' : 'Не удалось загрузить брони.'}</p>`;
            }
        }

        function bronHolati(holat, uz) {
            switch (holat) {
                case 'TAYYOR': return uz ? '🟢 Tayyor' : '🟢 Готов';
                case 'BERILDI': return uz ? '✅ Berildi' : '✅ Выдан';
                case 'BEKOR': return uz ? '❌ Bekor qilindi' : '❌ Отменён';
                default: return uz ? '🕐 Kutilmoqda' : '🕐 Ожидает';
            }
        }

        function esc(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function displayLoginPrompt() {
            profileContent.innerHTML = `
                <div class="login-prompt">
                    <div class="glass-card">
                        <h2 data-uz="Profilga kirish" data-ru="Войти в профиль">${currentLang === 'uz' ? 'Profilga kirish' : 'Войти в профиль'}</h2>
                        <p data-uz="Shaxsiy hisobingizga kirish uchun tizimga kiring" data-ru="Войдите в систему, чтобы получить доступ к вашему профилю">${currentLang === 'uz' ? 'Shaxsiy hisobingizga kirish uchun tizimga kiring' : 'Войдите в систему, чтобы получить доступ к вашему профилю'}</p>
                        <a href="login.html" class="login-link">
                            <span data-uz="Kirish" data-ru="Войти">${currentLang === 'uz' ? 'Kirish' : 'Войти'}</span>
                        </a>
                    </div>
                </div>
            `;
        }

        function logout() {
            const confirmLogout = confirm(currentLang === 'uz' 
                ? 'Haqiqatan ham chiqmoqchimisiz?' 
                : 'Вы действительно хотите выйти?');
            
            if (confirmLogout) {
                localStorage.removeItem('token');
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('userName');
                localStorage.removeItem('phone');
                localStorage.removeItem('smsCode');
                window.location.href = 'index.html';
            }
        }

        setLang(currentLang);
    </script>
</body>
</html>
