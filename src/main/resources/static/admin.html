<!DOCTYPE html>
<html lang="uz">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="auth-guard.js"></script>
    <script src="stickers.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin panel - Dori Qidiruv</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: #03100D;
            min-height: 100vh;
            color: #fff;
        }

        header {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background 0.4s ease, box-shadow 0.4s ease,
                        padding 0.3s ease, backdrop-filter 0.4s ease;
        }
        header.scrolled {
            background: rgba(3, 16, 13, 0.92);
            backdrop-filter: blur(40px) saturate(220%);
            -webkit-backdrop-filter: blur(40px) saturate(220%);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6),
                        0 1px 0 rgba(22, 198, 164, 0.25),
                        0 6px 20px rgba(22, 198, 164, 0.08);
            border-bottom: 1px solid rgba(22, 198, 164, 0.35);
            padding-top: 0.7rem;
            padding-bottom: 0.7rem;
        }

        .header-content {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(140deg, #3AE0BC, #16C6A4 55%, #0E6B5C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            margin-left: 1.2rem;
        }

        nav a:hover { color: #16C6A4; }

        .container { max-width: 1100px; margin: 0 auto; padding: 2rem; }

        h1 { font-size: 1.9rem; margin-bottom: 0.4rem; }

        .subtitle { color: rgba(255, 255, 255, 0.6); margin-bottom: 2rem; }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 1.2rem;
            text-align: center;
        }

        .stat-value { font-size: 2rem; font-weight: 700; color: #16C6A4; }
        .stat-label { color: rgba(255, 255, 255, 0.6); font-size: 0.9rem; }

        .tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }

        .tab {
            padding: 0.6rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.75);
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .tab.active {
            background: linear-gradient(140deg, #3AE0BC, #16C6A4 55%, #0E6B5C);
            color: #fff;
            border-color: transparent;
        }

        .panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 1.8rem;
            display: none;
        }

        .panel.active { display: block; }

        /* To'q fonda to'q yashil o'qilmaydi — yorqin ohangni ishlatamiz */
        .panel h2 { font-size: 1.2rem; margin-bottom: 1.2rem; color: #16C6A4; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        input, select {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border-radius: 12px;
            outline: none;
            font-size: 0.95rem;
        }

        input:focus, select:focus { border-color: #16C6A4; }
        input::placeholder { color: rgba(255, 255, 255, 0.4); }
        select option { background: #08211C; color: #fff; }

        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            background: linear-gradient(140deg, #3AE0BC, #16C6A4 55%, #0E6B5C);
            color: #fff;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn-danger {
            background: rgba(255, 107, 107, 0.15);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-danger:hover { background: rgba(255, 107, 107, 0.3); }

        .btn-small {
            background: rgba(22, 198, 164, 0.15);
            border: 1px solid #16C6A4;
            color: #16C6A4;
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-right: 0.4rem;
        }

        .btn-small:hover { background: rgba(22, 198, 164, 0.3); }

        .list { margin-top: 1.5rem; max-height: 55vh; overflow-y: auto; }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            padding: 0.9rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            flex-wrap: wrap;
        }

        .row:last-child { border-bottom: none; }
        .row-main { font-weight: 600; }
        .row-sub { display: block; font-size: 0.85rem; color: rgba(255, 255, 255, 0.5); }

        .message {
            margin-top: 1rem;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            display: none;
        }

        .message.show { display: block; }
        .message.ok { background: rgba(76, 175, 80, 0.15); border: 1px solid #4caf50; color: #a5d6a7; }
        .message.err { background: rgba(255, 107, 107, 0.15); border: 1px solid #ff6b6b; color: #ffabab; }

        .denied { text-align: center; padding: 5rem 2rem; }
        .denied h2 { font-size: 1.6rem; margin-bottom: 1rem; }

        /* ============================================================
           Suyuq shisha — bosh sahifa bilan bir xil chuqurlik va fon.
           Quyidagi qoidalar yuqoridagilarni to'ldiradi.
           ============================================================ */
        .aurora {
            position: fixed; inset: 0; z-index: -1; overflow: hidden;
            background:
                radial-gradient(1100px 700px at 50% -12%, #0F3B34 0%, transparent 62%),
                linear-gradient(180deg, #061815 0%, #03100D 58%);
        }
        .aurora span {
            position: absolute; display: block; border-radius: 50%;
            filter: blur(80px); opacity: 0.85; will-change: transform;
        }
        .aurora span:nth-child(1) {
            width: 46vw; height: 46vw; min-width: 320px; min-height: 320px;
            left: -10vw; top: -8vw;
            background: radial-gradient(circle, #12907A, transparent 68%);
            animation: suzish-a 26s cubic-bezier(0.4,0,0.2,1) infinite alternate;
        }
        .aurora span:nth-child(2) {
            width: 40vw; height: 40vw; min-width: 280px; min-height: 280px;
            right: -8vw; bottom: -6vw;
            background: radial-gradient(circle, #0D6C7A, transparent 68%);
            animation: suzish-b 32s cubic-bezier(0.4,0,0.2,1) infinite alternate;
        }
        @keyframes suzish-a { to { transform: translate3d(9vw, 7vh, 0) scale(1.14); } }
        @keyframes suzish-b { to { transform: translate3d(-8vw, -9vh, 0) scale(1.1); } }

        /* Shishaning qalinligi: tepa qirrasida yorug'lik, chekkasida sinish halqasi */
        .glass-card {
            position: relative;
            background: linear-gradient(160deg,
                rgba(255,255,255,0.095) 0%, rgba(255,255,255,0.055) 42%, rgba(255,255,255,0.03) 100%);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            border: none;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.30),
                inset 0 -1px 0 rgba(255,255,255,0.05),
                inset 0 0 30px rgba(255,255,255,0.035),
                0 18px 50px rgba(0,0,0,0.5),
                0 3px 10px rgba(0,0,0,0.32);
        }
        .glass-card::after {
            content: ''; position: absolute; inset: 0;
            border-radius: inherit; padding: 1px;
            background: linear-gradient(145deg,
                rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.08) 26%,
                rgba(255,255,255,0) 52%, rgba(255,255,255,0.06) 74%, rgba(255,255,255,0.22) 100%);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
            pointer-events: none;
        }

        /* Yorqin ko'kimtir-yashil fonda oq matn o'qilmaydi — to'q rang qo'yamiz */
        .submit-btn, .lang-btn.active, .logout-btn, .btn, .tab.active { color: #04211C; }

        .submit-btn, .logout-btn {
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 6px 20px rgba(22,198,164,0.3);
            font-family: inherit;
        }
        .submit-btn:hover, .logout-btn:hover { filter: brightness(1.06); }

        .country-select option { background: #08211C; color: #E9F3F0; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        :focus-visible { outline: 2px solid #16C6A4; outline-offset: 3px; border-radius: 6px; }

        /* ============================================================
           Katalog avtomat-tanlash (butun O'zbekiston dorilari ro'yxati)
           ============================================================ */
        .autocomplete-wrap { position: relative; }
        .autocomplete-list {
            display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 200;
            background: #FFFFFF; border: 1px solid rgba(0,0,0,0.12); border-radius: 14px;
            max-height: 320px; overflow-y: auto; box-shadow: 0 16px 40px rgba(0,0,0,0.18);
        }
        .autocomplete-list.open { display: block; }
        .ac-item {
            padding: 0.6rem 0.85rem; cursor: pointer; border-bottom: 1px solid rgba(0,0,0,0.06);
            display: flex; flex-direction: column; gap: 2px;
        }
        .ac-item:last-child { border-bottom: none; }
        .ac-item:hover, .ac-item.active { background: rgba(22,198,164,0.14); }
        .ac-nom { font-weight: 600; font-size: 0.9rem; color: #12211D; line-height: 1.3; }
        .ac-firma { font-size: 0.78rem; color: rgba(18,33,29,0.6); }
        .ac-empty { padding: 0.75rem 0.85rem; font-size: 0.85rem; color: rgba(18,33,29,0.6); }

        /* ============================================================
           YORUG' (OQ) MAVZU — yuqoridagi to'q ranglarni almashtiradi
           ============================================================ */
        body { background: #EAF1EE; color: #12211D; }
        .aurora {
            background:
                radial-gradient(1100px 700px at 50% -12%, #D9EFEA 0%, transparent 62%),
                linear-gradient(180deg, #F4F9F7 0%, #E7F0ED 58%);
        }
        .aurora span { opacity: 0.45; filter: blur(90px); }
        .aurora span:nth-child(1) { background: radial-gradient(circle, #8FE0D0, transparent 68%); }
        .aurora span:nth-child(2) { background: radial-gradient(circle, #A6D6E0, transparent 68%); }

        header { background: rgba(255,255,255,0.72); border-bottom: 1px solid rgba(0,0,0,0.08); }
        header.scrolled {
            background: rgba(255,255,255,0.94);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            box-shadow: 0 4px 24px rgba(0,0,0,0.08), 0 1px 0 rgba(22,198,164,0.25);
            border-bottom-color: rgba(22,198,164,0.35);
        }
        nav a { color: rgba(18,33,29,0.75); }
        nav a:hover { color: #0E9E86; }

        .subtitle { color: rgba(18,33,29,0.6); }
        .stat, .panel, .tab {
            background: #FFFFFF; border: 1px solid rgba(0,0,0,0.08);
        }
        .stat-value { color: #0E9E86; }
        .stat-label { color: rgba(18,33,29,0.6); }
        .tab { color: rgba(18,33,29,0.72); border: 1px solid rgba(0,0,0,0.1); }
        .panel h2 { color: #0E9E86; }

        input, select {
            background: #FFFFFF; border: 1px solid rgba(0,0,0,0.15); color: #12211D;
        }
        input::placeholder { color: rgba(18,33,29,0.4); }
        select option { background: #FFFFFF; color: #12211D; }

        .row { border-bottom: 1px solid rgba(0,0,0,0.08); }
        .row-sub { color: rgba(18,33,29,0.55); }

        .glass-card {
            background: linear-gradient(160deg,
                rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.78) 100%);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.85),
                0 14px 44px rgba(0,0,0,0.10),
                0 2px 8px rgba(0,0,0,0.06);
        }
        .glass-card::after {
            background: linear-gradient(145deg,
                rgba(0,0,0,0.10) 0%, rgba(0,0,0,0.02) 50%, rgba(0,0,0,0.06) 100%);
        }

        .message.ok { background: rgba(76,175,80,0.12); border: 1px solid #4caf50; color: #2e7d32; }
        .message.err { background: rgba(229,57,53,0.10); border: 1px solid #e53935; color: #c62828; }
        .btn-small { background: rgba(22,198,164,0.12); }
        .btn-small:hover { background: rgba(22,198,164,0.22); }
        .btn-danger { background: rgba(229,57,53,0.10); border: 1px solid #e53935; color: #e53935; }
        .btn-danger:hover { background: rgba(229,57,53,0.2); }
    </style>
</head>
<body>
    <div class="aurora" aria-hidden="true"><span></span><span></span></div>

    <header>
        <div class="header-content">
            <div class="logo"><img class="stk stk-lg" data-stk="pill" src="icons/pill.png" onerror="stkFallback(this)"> Dori Qidiruv</div>
            <nav>
                <a href="index.html">Bosh sahifa</a>
                <a href="dorixonalar.html">Dorixonalar</a>
                <a href="profil.html">Profil</a>
            </nav>
        </div>
    </header>

    <div class="container" id="container">
        <p class="subtitle">Tekshirilmoqda...</p>
    </div>

    <script>
        const token = localStorage.getItem('token');

        function authHeaders(extra) {
            const headers = Object.assign({ 'Authorization': 'Bearer ' + token }, extra || {});
            return headers;
        }

        function esc(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function showMessage(text, ok) {
            const el = document.getElementById('message');
            if (!el) return;
            el.innerHTML = text;
            el.className = 'message show ' + (ok ? 'ok' : 'err');
            setTimeout(function () { el.className = 'message'; }, 4000);
        }

        // Admin emasligini bilsak, panelni umuman ko'rsatmaymiz.
        fetch('/api/admin/check', { headers: authHeaders() })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (data && data.admin) renderPanel();
                else renderDenied();
            })
            .catch(renderDenied);

        function renderDenied() {
            document.getElementById('container').innerHTML =
                '<div class="denied"><h2>' + stk('denied') + ' Ruxsat yo\'q</h2>' +
                '<p class="subtitle">Bu bo\'lim faqat administratorlar uchun.</p>' +
                '<a href="index.html" class="btn" style="text-decoration:none;">Bosh sahifaga qaytish</a></div>';
        }

        function renderPanel() {
            document.getElementById('container').innerHTML = `
                <h1>${stk('lock','stk-lg')} Admin panel</h1>
                <p class="subtitle">Dorixonalar, dorilar va foydalanuvchilarni boshqarish</p>

                <div class="stats" id="stats"></div>

                <div class="tabs">
                    <button class="tab active" onclick="openTab('pharmacies', this)">${stk('pharmacy','stk-nav')} Dorixonalar</button>
                    <button class="tab" onclick="openTab('drugs', this)">${stk('pill','stk-nav')} Dorilar</button>
                    <button class="tab" onclick="openTab('katalog', this)">${stk('search','stk-nav')} Katalog</button>
                    <button class="tab" onclick="openTab('stock', this)">${stk('box','stk-nav')} Ombor / Hisobot</button>
                    <button class="tab" onclick="openTab('claims', this)">${stk('mail','stk-nav')} Arizalar</button>
                    <button class="tab" onclick="openTab('users', this)">${stk('group','stk-nav')} Foydalanuvchilar</button>
                </div>

                <div class="panel active" id="tab-pharmacies">
                    <h2>${stk('plus','stk-card')} Dorixona qo'shish</h2>
                    <div class="form-grid">
                        <input id="phName" placeholder="Nomi *">
                        <input id="phAddress" placeholder="Manzil">
                        <input id="phPhone" placeholder="Telefon">
                        <input id="phKarta" placeholder="Karta raqami (8600 1234 5678 9012)">
                        <input id="phLat" placeholder="Kenglik (41.3451)">
                        <input id="phLon" placeholder="Uzunlik (69.2861)">
                    </div>
                    <button class="btn" onclick="addPharmacy()">Qo'shish</button>
                    <div class="message" id="message"></div>
                    <div class="list" id="pharmacyList"></div>
                </div>

                <div class="panel" id="tab-drugs">
                    <h2>${stk('plus','stk-card')} Dori qo'shish</h2>
                    <p class="subtitle" style="margin-bottom:1rem;">Nomni yozib, butun O'zbekiston katalogidan tanlang — firma va davlat o'zi to'ladi. Keyin narxni kiriting.</p>
                    <div class="form-grid">
                        <div class="autocomplete-wrap">
                            <input id="drName" placeholder="Nomi * — katalogdan qidiring" autocomplete="off"
                                   oninput="katalogQidir(this.value)" onkeydown="katalogKlaviatura(event)">
                            <div id="katalogNatija" class="autocomplete-list" data-no-swipe></div>
                        </div>
                        <input id="drNameRu" placeholder="Ruscha nomi">
                        <input id="drManufacturer" placeholder="Ishlab chiqaruvchi">
                        <input id="drPriceDona" placeholder="Dona narxi (so'm)" type="number">
                        <input id="drPricePachka" placeholder="Pachka narxi (so'm)" type="number">
                        <input id="drPachkadagiDona" placeholder="Pachkadagi dona soni (masalan 10)" type="number">
                        <select id="drPharmacy"></select>
                        <select id="drAvailable">
                            <option value="true">🟢 Mavjud</option>
                            <option value="false">🔴 Mavjud emas</option>
                        </select>
                    </div>
                    <button class="btn" onclick="addDrug()">Qo'shish</button>
                    <div class="form-grid" style="margin-top:1.5rem;">
                        <select id="filterPharmacy" onchange="loadDrugs()"></select>
                    </div>
                    <div id="excelButtons" style="display:none; margin-top:1rem; gap:0.6rem; flex-wrap:wrap; align-items:center;">
                        <button class="btn" onclick="excelYangilash()" style="background:linear-gradient(140deg,#ff9800,#f57c00);font-size:0.9rem;">Excel: Dorilarni yangilash</button>
                        <button class="btn" onclick="excelQoshish()" style="font-size:0.9rem;">Excel: Yangi dorilar qo'shish</button>
                        <input type="file" id="excelFile" accept=".xlsx,.xls" style="display:none;" onchange="excelYuborish()">
                        <span id="excelHolat" class="row-sub"></span>
                    </div>
                    <div class="message" id="excelMessage"></div>
                    <div class="list" id="drugList"></div>
                </div>

                <div class="panel" id="tab-katalog">
                    <h2>${stk('search','stk-card')} Dorilar katalogi</h2>
                    <p class="subtitle" style="margin-bottom:1rem;">Butun O'zbekiston bo'yicha dorilar ro'yxati. Bu — ma'lumotnoma:
                        dorixona egasi "Dori qo'shish"da shu ro'yxatdan tanlaydi. Mijozga esa faqat narx qo'yilgan dorilar ko'rinadi.</p>
                    <div class="form-grid">
                        <input id="katalogQidiruv" placeholder="Nomi yoki firma bo'yicha qidiring..." oninput="katalogRoyxatQidir(this.value)">
                    </div>
                    <div id="katalogJami" class="subtitle" style="margin:0.5rem 0;"></div>
                    <div class="list" id="katalogRoyxat"></div>
                    <div id="katalogSahifalar" style="display:flex; gap:0.5rem; justify-content:center; margin-top:1rem; flex-wrap:wrap;"></div>
                </div>

                <div class="panel" id="tab-stock">
                    <h2>${stk('box','stk-card')} Ombor hisobi</h2>
                    <p class="subtitle">Dorixonani tanlang — qancha mahsulot kelgan, qancha sotilgan va qancha qolgani ko'rinadi.
                        Qoldiq alohida saqlanmaydi, u kirim va chiqimdan hisoblanadi.</p>
                    <div class="form-grid" style="margin-top:1rem;">
                        <select id="stockPharmacy" onchange="loadStock()"></select>
                    </div>
                    <div class="message" id="stockMessage"></div>
                    <div class="stats" id="stockTotals" style="margin-top:1rem;"></div>
                    <div class="list" id="stockList"></div>
                </div>

                <div class="panel" id="tab-claims">
                    <h2>${stk('mail','stk-card')} Dorixona ulash arizalari</h2>
                    <p class="subtitle">Dorixona egasi botda ariza beradi. Ikkinchi suratda —
                        dorixonaning jonli surati — bot bergan kod yozilgan qog'oz ko'rinishi kerak.
                        Kod mos kelmasa yoki hujjat o'qilmasa, rad eting.</p>
                    <div class="message" id="claimMessage"></div>
                    <div class="list" id="claimList"></div>
                </div>

                <div class="panel" id="tab-users">
                    <h2>${stk('group','stk-card')} Ro'yxatdan o'tgan foydalanuvchilar</h2>
                    <div class="list" id="userList"></div>
                </div>`;

            loadStats();
            loadPharmacies();
        }

        var TAB_ORDER = ['pharmacies', 'drugs', 'katalog', 'stock', 'claims', 'users'];

        function openTab(name, button) {
            document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
            document.querySelectorAll('.panel').forEach(function (p) { p.classList.remove('active'); });
            if (!button) button = document.querySelectorAll('.tab')[TAB_ORDER.indexOf(name)];
            if (button) button.classList.add('active');
            document.getElementById('tab-' + name).classList.add('active');
            if (name === 'users') loadUsers();
            if (name === 'drugs') loadDrugs();
            if (name === 'katalog') loadKatalog();
            if (name === 'stock') loadStock();
            if (name === 'claims') loadClaims();
        }

        // Admin tablari orasida barmoq bilan surish
        (function () {
            var sx = 0, sy = 0, t0 = 0, faol = false;
            function bloklangan(el) {
                return el.closest('input,textarea,select,button,a,label,[data-no-swipe]');
            }
            document.addEventListener('touchstart', function (e) {
                if (e.touches.length !== 1 || bloklangan(e.target)) { faol = false; return; }
                sx = e.touches[0].clientX; sy = e.touches[0].clientY; t0 = Date.now(); faol = true;
            }, { passive: true });
            document.addEventListener('touchend', function (e) {
                if (!faol) return;
                faol = false;
                var t = e.changedTouches[0];
                var dx = t.clientX - sx, dy = t.clientY - sy, dt = Date.now() - t0;
                if (dt > 700 || Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 2) return;
                var joriy = -1;
                document.querySelectorAll('.tab').forEach(function (btn, i) {
                    if (btn.classList.contains('active')) joriy = i;
                });
                if (joriy < 0) return;
                var yangi = dx < 0 ? joriy + 1 : joriy - 1;
                if (yangi < 0 || yangi >= TAB_ORDER.length) return;
                openTab(TAB_ORDER[yangi]);
            }, { passive: true });
        })();

        function loadStats() {
            fetch('/api/admin/stats', { headers: authHeaders() })
                .then(function (r) { return r.json(); })
                .then(function (s) {
                    document.getElementById('stats').innerHTML = `
                        <div class="stat"><div class="stat-value">${s.users}</div><div class="stat-label">Foydalanuvchi</div></div>
                        <div class="stat"><div class="stat-value">${s.pharmacies}</div><div class="stat-label">Dorixona</div></div>
                        <div class="stat"><div class="stat-value">${s.drugs}</div><div class="stat-label">Sotuvdagi dori</div></div>
                        <div class="stat"><div class="stat-value">${(s.katalog || 0).toLocaleString('ru-RU')}</div><div class="stat-label">Katalogda dori</div></div>`;
                })
                .catch(function () {});
        }

        let pharmacies = [];

        function loadPharmacies() {
            fetch('/api/dorixona')
                .then(function (r) { return r.json(); })
                .then(function (list) {
                    pharmacies = list;
                    document.getElementById('pharmacyList').innerHTML =
                        '<h2 style="margin-top:1.5rem;">' + stk('pharmacy') + ' Barcha dorixonalar (' + list.length + ')</h2>' +
                        list.map(function (p) {
                            const obuna = obunaHolati(p.obunaTugashi);
                            return `<div class="row">
                                <span><span class="row-main">${esc(p.name)}</span>
                                <span class="row-sub">${esc(p.address || '')} · ${esc(p.telefon || '')} · ${obuna}</span></span>
                                <span>
                                    <button class="btn-small" onclick="obunaBelgilash(${p.id}, '${esc(p.name).replace(/'/g, "\\'")}', '${p.obunaTugashi || ''}')">Obuna</button>
                                    <button class="btn-danger" onclick="deletePharmacy(${p.id}, '${esc(p.name).replace(/'/g, "\\'")}')">O'chirish</button>

        function fillPharmacySelects() {
            const options = pharmacies.map(function (p) {
                return '<option value="' + p.id + '">' + esc(p.name) + '</option>';
            }).join('');
            const drSelect = document.getElementById('drPharmacy');
            const filter = document.getElementById('filterPharmacy');
            const stockSelect = document.getElementById('stockPharmacy');
            if (drSelect) drSelect.innerHTML = options;
            if (filter) filter.innerHTML = '<option value="">— Dorixonani tanlang (dorilarini ko\'rish) —</option>' + options;
            if (stockSelect) stockSelect.innerHTML = '<option value="">— Dorixonani tanlang (hisobotini ko\'rish) —</option>' + options;
        }

        function addPharmacy() {
            const name = document.getElementById('phName').value.trim();
            if (!name) { showMessage('Dorixona nomini kiriting', false); return; }
            const body = {
                name: name,
                address: document.getElementById('phAddress').value.trim(),
                telefon: document.getElementById('phPhone').value.trim(),
                kartaRaqami: document.getElementById('phKarta').value.trim() || null,
                latitude: parseFloat(document.getElementById('phLat').value) || null,
                longitude: parseFloat(document.getElementById('phLon').value) || null
            };
            fetch('/api/dorixona', {
                method: 'POST',
                headers: authHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify(body)
            })
                .then(function (r) {
                    if (!r.ok) throw new Error();
                    showMessage(stk('check') + ' Dorixona qo\'shildi', true);
                    ['phName', 'phAddress', 'phPhone', 'phKarta', 'phLat', 'phLon'].forEach(function (id) {

        function deletePharmacy(id, name) {
            if (!confirm('«' + name + '» o\'chirilsinmi? Undagi dorilar ham o\'chadi.')) return;
            fetch('/api/dorixona/' + id, { method: 'DELETE', headers: authHeaders() })
                .then(function (r) {
                    if (!r.ok) throw new Error();
                    showMessage(stk('check') + ' O\'chirildi', true);
                    loadPharmacies();
                    loadStats();
                })
                .catch(function () { showMessage(stk('cancel') + ' O\'chirib bo\'lmadi', false); });
        }

        // ==== Katalogdan qidirish (butun O'zbekiston, ~26 ming nom) ====
        let katalogNatijalar = [];
        let katalogTanlangan = -1;
        let katalogTimer = null;

        function katalogQidir(q) {
            katalogTanlangan = -1;
            clearTimeout(katalogTimer);
            q = (q || '').trim();
            if (q.length < 2) { katalogYop(); return; }
            // Debounce — har harfda so'rov yubormaslik uchun
            katalogTimer = setTimeout(function () {
                fetch('/api/katalog/qidirish?q=' + encodeURIComponent(q) + '&limit=20', { headers: authHeaders() })
                    .then(function (r) { return r.ok ? r.json() : []; })
                    .then(function (list) {
                        katalogNatijalar = list || [];
                        katalogChiz();
                    })
                    .catch(function () { katalogYop(); });
            }, 250);
        }

        function katalogChiz() {
            const box = document.getElementById('katalogNatija');
            if (!katalogNatijalar.length) {
                box.innerHTML = '<div class="ac-empty">Katalogdan topilmadi — nomni qo\'lda yozishingiz mumkin</div>';
                box.classList.add('open');
                return;
            }
            box.innerHTML = katalogNatijalar.map(function (k, i) {
                const firma = [k.ishlabChiqaruvchi, k.davlat].filter(Boolean).join(', ');
                return '<div class="ac-item' + (i === katalogTanlangan ? ' active' : '') + '" onmousedown="katalogTanla(' + i + ')">'
                    + '<span class="ac-nom">' + esc(k.nomi) + '</span>'
                    + (firma ? '<span class="ac-firma">' + esc(firma) + '</span>' : '')
                    + '</div>';
            }).join('');
            box.classList.add('open');
        }

        function katalogTanla(i) {
            const k = katalogNatijalar[i];
            if (!k) return;
            document.getElementById('drName').value = k.nomi || '';
            document.getElementById('drNameRu').value = k.nomi || '';
            const firma = [k.ishlabChiqaruvchi, k.davlat].filter(Boolean).join(', ');
            document.getElementById('drManufacturer').value = firma;
            katalogYop();
            document.getElementById('drPriceDona').focus();
        }

        function katalogYop() {
            const box = document.getElementById('katalogNatija');
            box.classList.remove('open');
            box.innerHTML = '';
            katalogNatijalar = [];
            katalogTanlangan = -1;
        }

        // Yuqoriga/pastga strelka va Enter bilan tanlash
        function katalogKlaviatura(e) {
            if (!katalogNatijalar.length) return;
            if (e.key === 'ArrowDown') { e.preventDefault(); katalogTanlangan = Math.min(katalogTanlangan + 1, katalogNatijalar.length - 1); katalogChiz(); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); katalogTanlangan = Math.max(katalogTanlangan - 1, 0); katalogChiz(); }
            else if (e.key === 'Enter' && katalogTanlangan >= 0) { e.preventDefault(); katalogTanla(katalogTanlangan); }
            else if (e.key === 'Escape') { katalogYop(); }
        }

        // Tashqariga bosilganda ro'yxatni yopish
        document.addEventListener('click', function (e) {
            if (!e.target.closest('.autocomplete-wrap')) katalogYop();
        });

        // ==== Katalogni ko'rish/qidirish (browse) ====
        let katalogRoyxatQuery = '';
        let katalogRoyxatSahifa = 0;
        let katalogRoyxatTimer = null;

        function loadKatalog() {
            katalogRoyxatSahifa = 0;
            fetchKatalogRoyxat();
        }

        function katalogRoyxatQidir(q) {
            clearTimeout(katalogRoyxatTimer);
            katalogRoyxatQuery = (q || '').trim();
            katalogRoyxatSahifa = 0;
            katalogRoyxatTimer = setTimeout(fetchKatalogRoyxat, 300);
        }

        function fetchKatalogRoyxat() {
            const jamiEl = document.getElementById('katalogJami');
            const royxatEl = document.getElementById('katalogRoyxat');
            jamiEl.textContent = 'Yuklanmoqda...';
            const url = '/api/katalog/royxat?page=' + katalogRoyxatSahifa + '&size=50'
                + (katalogRoyxatQuery ? '&q=' + encodeURIComponent(katalogRoyxatQuery) : '');
            fetch(url, { headers: authHeaders() })
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (data) {
                    if (!data) { jamiEl.textContent = 'Xatolik'; return; }
                    const jami = data.jami || 0;
                    jamiEl.innerHTML = '<b style="color:#0E9E86;">' + jami.toLocaleString('ru-RU') + '</b> ta dori'
                        + (katalogRoyxatQuery ? ' (qidiruv bo\'yicha)' : ' katalogda');
                    const dorilar = data.dorilar || [];
                    if (!dorilar.length) {
                        royxatEl.innerHTML = '<p class="subtitle" style="margin-top:1rem;">Topilmadi.</p>';
                        document.getElementById('katalogSahifalar').innerHTML = '';
                        return;
                    }
                    royxatEl.innerHTML = dorilar.map(function (k) {
                        const firma = [k.ishlabChiqaruvchi, k.davlat].filter(Boolean).join(', ');
                        return `<div class="row">
                            <span><span class="row-main">${esc(k.nomi)}</span>
                            <span class="row-sub">${esc(firma) || '—'}</span></span>
                        </div>`;
                    }).join('');
                    renderKatalogSahifalar(data.sahifalarSoni || 1);
                })
                .catch(function () { jamiEl.textContent = 'Xatolik'; });
        }

        function renderKatalogSahifalar(jami) {
            const el = document.getElementById('katalogSahifalar');
            if (jami <= 1) { el.innerHTML = ''; return; }
            const joriy = katalogRoyxatSahifa;
            let html = '';
            if (joriy > 0) html += '<button class="btn-small" onclick="katalogSahifaGa(' + (joriy - 1) + ')">‹ Oldingi</button>';
            html += '<span class="subtitle" style="align-self:center;">' + (joriy + 1) + ' / ' + jami + '</span>';
            if (joriy < jami - 1) html += '<button class="btn-small" onclick="katalogSahifaGa(' + (joriy + 1) + ')">Keyingi ›</button>';
            el.innerHTML = html;
        }

        function katalogSahifaGa(p) {
            katalogRoyxatSahifa = p;
            fetchKatalogRoyxat();
            document.getElementById('tab-katalog').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function addDrug() {
            const name = document.getElementById('drName').value.trim();
            const priceDona = parseFloat(document.getElementById('drPriceDona').value) || null;
            const pricePachka = parseFloat(document.getElementById('drPricePachka').value) || null;
            const pharmacyId = document.getElementById('drPharmacy').value;
            if (!name || !pharmacyId) { showMessage('Nomi va dorixonani to\'ldiring', false); return; }
            if (!priceDona && !pricePachka) { showMessage('Kamida bitta narx kiriting (dona yoki pachka)', false); return; }
            const pachkadagiDona = parseInt(document.getElementById('drPachkadagiDona').value, 10) || null;
            const body = {
                name: name,
                nameRu: document.getElementById('drNameRu').value.trim() || null,
                manufacturer: document.getElementById('drManufacturer').value.trim(),
                price: priceDona,
                pachkaNarx: pricePachka,
                pachkadagiDona: pachkadagiDona,
                available: document.getElementById('drAvailable').value === 'true',
                dorixonaId: parseInt(pharmacyId, 10)
            };
            fetch('/api/dori', {
                method: 'POST',
                headers: authHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify(body)
            })
                .then(function (r) {
                    if (!r.ok) throw new Error();
                    showMessage(stk('check') + ' Dori qo\'shildi', true);
                    ['drName', 'drNameRu', 'drManufacturer', 'drPriceDona', 'drPricePachka', 'drPachkadagiDona'].forEach(function (id) {
                        document.getElementById(id).value = '';
                    });
                    loadStats();
                    if (document.getElementById('filterPharmacy').value === pharmacyId) loadDrugs();
                })
                .catch(function () { showMessage(stk('cancel') + ' Qo\'shib bo\'lmadi', false); });
        }

        function loadDrugs() {
            const id = document.getElementById('filterPharmacy').value;
            const list = document.getElementById('drugList');
            const excelBtns = document.getElementById('excelButtons');
            if (!id) {
                list.innerHTML = '<p class="subtitle" style="margin-top:1rem;">Dorilarini ko\'rish uchun dorixonani tanlang.</p>';
                if (excelBtns) excelBtns.style.display = 'none';
                return;
            }
            if (excelBtns) excelBtns.style.display = 'flex';
            fetch('/api/dorixona/' + id + '/dorilar')
                .then(function (r) { return r.json(); })
                .then(function (drugs) {
                    list.innerHTML = '<h2 style="margin-top:1rem;">' + stk('pill') + ' Dorilar (' + drugs.length + ')</h2>' +
                        drugs.map(function (d) {
                            return `<div class="row">
                                <span><span class="row-main">${esc(d.name)}</span>
                                <span class="row-sub">${esc(d.nameRu || '')} · ${esc(d.manufacturer || '')} · ${d.price ? "Dona: " + d.price.toLocaleString() + " so'm" : ''}${d.price && d.pachkaNarx ? ' · ' : ''}${d.pachkaNarx ? "Pachka: " + d.pachkaNarx.toLocaleString() + " so'm" : ''}${!d.price && !d.pachkaNarx ? "narx yo'q" : ''} ${d.pachkadagiDona ? '· 1 pachka = ' + d.pachkadagiDona + ' dona' : ''} · ${omborHolati(d)}</span></span>
                                <span>
                                    <button class="btn-small" onclick="editPrice(${d.id}, ${d.price || 0}, ${d.pachkaNarx || 0}, '${esc(d.name).replace(/'/g, "\\'")}')">Narx</button>
                                    <button class="btn-danger" onclick="deleteDrug(${d.id}, '${esc(d.name).replace(/'/g, "\\'")}')">O'chirish</button>
                                </span>
                            </div>`;
                        }).join('');
                });
        }

        /**
         * Ombor holati. Hisob yuritilmagan mahsulotda qoldiq 0 chiqadi, lekin bu "tugagan"
         * degani emas — shuning uchun bunday holatda faqat mavjud/mavjud emas belgisi qoladi.
         */
        function omborHolati(d) {
            if (!d.hisobYuritiladi) return d.available ? stk('available') + ' mavjud' : stk('unavailable') + ' mavjud emas';
            if (!d.qoldiq || d.qoldiq <= 0) return stk('unavailable') + ' tugagan';
            return stk('box') + ' ' + d.qoldiq + ' ta';
        }

        function editPrice(id, currentDona, currentPachka, name) {
            const inputDona = prompt('«' + name + '» — dona narxi (so\'m):', currentDona || '');
            if (inputDona === null) return;
            const inputPachka = prompt('«' + name + '» — pachka narxi (so\'m):', currentPachka || '');
            if (inputPachka === null) return;
            const priceDona = parseFloat(inputDona) || null;
            const pricePachka = parseFloat(inputPachka) || null;
            if (!priceDona && !pricePachka) { showMessage('Kamida bitta narx kiriting', false); return; }
            fetch('/api/dori/' + id, {
                method: 'PUT',
                headers: authHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({ price: priceDona, pachkaNarx: pricePachka })
            })
                .then(function (r) {
                    if (!r.ok) throw new Error();
                    showMessage(stk('check') + ' Narx yangilandi', true);
                    loadDrugs();
                })
                .catch(function () { showMessage(stk('cancel') + ' Yangilab bo\'lmadi', false); });
        }

        function deleteDrug(id, name) {
            if (!confirm('«' + name + '» o\'chirilsinmi?')) return;
            fetch('/api/dori/' + id, { method: 'DELETE', headers: authHeaders() })
                .then(function (r) {
                    if (!r.ok) throw new Error();
                    showMessage(stk('check') + ' O\'chirildi', true);
                    loadDrugs();
                    loadStats();
                })
                .catch(function () { showMessage(stk('cancel') + ' O\'chirib bo\'lmadi', false); });
        }

        function son(value) { return (value || 0).toLocaleString('ru-RU').replace(/ /g, ' '); }

        function loadStock() {
            const id = document.getElementById('stockPharmacy').value;
            const list = document.getElementById('stockList');
            const totals = document.getElementById('stockTotals');
            if (!id) {
                totals.innerHTML = '';
                list.innerHTML = '<p class="subtitle" style="margin-top:1rem;">Hisobotni ko\'rish uchun dorixonani tanlang.</p>';
                return;
            }
            fetch('/api/admin/ombor/hisobot/' + id, { headers: authHeaders() })
                .then(function (r) { return r.json(); })
                .then(function (h) {
                    totals.innerHTML = `
                        <div class="stat"><div class="stat-value">${son(h.turlarSoni)}</div><div class="stat-label">Mahsulot turi</div></div>
                        <div class="stat"><div class="stat-value">${son(h.jamiKelgan)}</div><div class="stat-label">${stk('inbox')} Kelgan</div></div>
                        <div class="stat"><div class="stat-value">${son(h.jamiSotilgan)}</div><div class="stat-label">${stk('outbox')} Sotilgan</div></div>
                        <div class="stat"><div class="stat-value">${son(h.jamiQoldiq)}</div><div class="stat-label">${stk('chart')} Qoldiq</div></div>
                        <div class="stat"><div class="stat-value">${son(Math.round(h.jamiTushum))}</div><div class="stat-label">${stk('money')} Tushum (so'm)</div></div>
                        <div class="stat"><div class="stat-value">${son(Math.round(h.omborQiymati))}</div><div class="stat-label">${stk('label')} Ombordagi tovar (so'm)</div></div>`;

                    list.innerHTML = '<h2 style="margin-top:1.5rem;">' + stk('box') + ' Mahsulotlar (' + h.mahsulotlar.length + ')</h2>' +
                        h.mahsulotlar.map(function (m) {
                            const holat = !m.hisobYuritiladi
                                ? '<span class="row-sub">hisob yuritilmagan</span>'
                                : (m.qoldiq <= 0 ? stk('unavailable') + ' tugagan' : stk('available') + ' ' + son(m.qoldiq) + ' ta');
                            const nomi = esc(m.nomi).replace(/'/g, "\\'");
                            return `<div class="row">
                                <span><span class="row-main">${esc(m.nomi)}</span>
                                <span class="row-sub">${stk('inbox')} ${son(m.kelgan)} · ${stk('outbox')} ${son(m.sotilgan)} · ${stk('chart')} ${son(m.qoldiq)} · ${stk('money')} ${son(Math.round(m.tushum))} so'm</span></span>
                                <span>
                                    ${holat}
                                    <button class="btn-small" onclick="omborHarakat(${m.doriId}, 'kirim', '${nomi}', ${m.qoldiq})">${stk('inbox')} Kirim</button>
                                    <button class="btn-small" onclick="omborHarakat(${m.doriId}, 'chiqim', '${nomi}', ${m.qoldiq})">${stk('outbox')} Sotildi</button>
                                </span>
                            </div>`;
                        }).join('');
                })
                .catch(function () {
                    totals.innerHTML = '';
                    list.innerHTML = '<p class="subtitle">Hisobotni yuklab bo\'lmadi</p>';
                });
        }

        function omborHarakat(doriId, turi, nomi, qoldiq) {
            const savol = turi === 'kirim'
                ? '«' + nomi + '» — nechta keldi?'
                : '«' + nomi + '» — nechta sotildi? (omborda ' + qoldiq + ' ta)';
            const input = prompt(savol, '');
            if (input === null) return;
            const soni = parseInt(input, 10);
            if (!soni || soni <= 0) { stockMessage(stk('cancel') + ' Son noto\'g\'ri, butun musbat raqam kiriting', false); return; }

            fetch('/api/admin/ombor/' + turi, {
                method: 'POST',
                headers: authHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({ doriId: doriId, soni: soni, izoh: 'sayt admin paneli' })
            })
                .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
                .then(function (res) {
                    if (!res.ok) {
                        stockMessage(stk('cancel') + ' ' + (res.data.xato || 'Yozib bo\'lmadi') + ' (qoldiq: ' + res.data.qoldiq + ')', false);
                        return;
                    }
                    stockMessage(stk('check') + ' ' + (turi === 'kirim' ? 'Kirim' : 'Sotuv') + ' yozildi. Yangi qoldiq: ' + res.data.qoldiq, true);
                    loadStock();
                })
                .catch(function () { stockMessage(stk('cancel') + ' Yozib bo\'lmadi', false); });
        }

        function stockMessage(text, ok) {
            const box = document.getElementById('stockMessage');
            if (!box) return;
            box.innerHTML = text;
            box.className = 'message show ' + (ok ? 'ok' : 'err');
            setTimeout(function () { box.className = 'message'; }, 5000);
        }

        /**
         * Dorixona ulash arizalari. Ariza botda beriladi, lekin admin uni shu yerdan ham
         * hal qila oladi — sayt va botlar bitta bazadan ishlaydi.
         */
        function loadClaims() {
            const list = document.getElementById('claimList');
            list.innerHTML = '<p class="subtitle">Yuklanmoqda…</p>';
            fetch('/api/admin/soov', { headers: authHeaders() })
                .then(function (r) { return r.json(); })
                .then(function (arizalar) {
                    if (!arizalar.length) {
                        list.innerHTML = '<p class="subtitle">' + stk('mail') + ' Yangi ariza yo\'q.</p>';
                        return;
                    }
                    list.innerHTML = arizalar.map(function (a) {
                        return `<div class="row" style="flex-direction:column;align-items:stretch;gap:0.8rem;">
                            <div>
                                <span class="row-main">${stk('mail')} Ariza №${a.id} — ${esc(a.dorixonaNomi)}</span>
                                <span class="row-sub">
                                    ${stk('user')} ${esc(a.ism || '—')}
                                    ${a.username ? ' · @' + esc(a.username) : ''}
                                    · ${stk('id')} ${a.telegramId}
                                </span>
                                <span class="row-sub">${stk('phone')} ${esc(a.telefon || '—')} · ${stk('key')} kod: <b>${esc(a.tekshiruvKodi || '—')}</b></span>
                            </div>
                            <div style="display:flex;gap:0.8rem;flex-wrap:wrap;">
                                <figure style="margin:0;">
                                    <div id="rasm-${a.id}-litsenziya" class="row-sub">Yuklanmoqda…</div>
                                    <figcaption class="row-sub">${stk('doc')} Litsenziya</figcaption>
                                </figure>
                                <figure style="margin:0;">
                                    <div id="rasm-${a.id}-jonli" class="row-sub">Yuklanmoqda…</div>
                                    <figcaption class="row-sub">${stk('camera')} Jonli surat — kod <b>${esc(a.tekshiruvKodi || '—')}</b> ko'rinishi kerak</figcaption>
                                </figure>
                            </div>
                            <div>
                                <button class="btn-small" onclick="arizaQarori(${a.id}, 'tasdiq')">${stk('check')} Tasdiqlash</button>
                                <button class="btn-danger" onclick="arizaQarori(${a.id}, 'rad')">${stk('cancel')} Rad etish</button>
                            </div>
                        </div>`;
                    }).join('');

                    // Suratlar alohida yuklanadi: <img> tegi Authorization sarlavhasini
                    // yubormaydi, shuning uchun to'g'ridan-to'g'ri src qo'yib bo'lmaydi.
                    arizalar.forEach(function (a) {
                        rasmniYukla(a.id, 'litsenziya');
                        rasmniYukla(a.id, 'jonli');
                    });
                })
                .catch(function () {
                    list.innerHTML = '<p class="subtitle">Arizalarni yuklab bo\'lmadi</p>';
                });
        }

        /** Dalil suratini token bilan yuklab, sahifada ko'rsatadi. */
        function rasmniYukla(soovId, turi) {
            const box = document.getElementById('rasm-' + soovId + '-' + turi);
            if (!box) return;
            fetch('/api/admin/soov/' + soovId + '/rasm/' + turi, { headers: authHeaders() })
                .then(function (r) {
                    if (!r.ok) throw new Error('yo\'q');
                    return r.blob();
                })
                .then(function (blob) {
                    const url = URL.createObjectURL(blob);
                    box.innerHTML = '<a href="' + url + '" target="_blank" rel="noopener">'
                        + '<img src="' + url + '" alt="dalil" style="max-width:220px;border-radius:12px;display:block;"></a>';
                })
                .catch(function () {
                    box.textContent = turi === 'jonli' ? 'Jonli surat yo\'q' : 'Litsenziya surati yo\'q';
                });
        }

        function arizaQarori(id, qaror) {
            const savol = qaror === 'tasdiq'
                ? 'Ariza №' + id + ' tasdiqlansinmi? Dorixona shu odamga biriktiriladi.'
                : 'Ariza №' + id + ' rad etilsinmi?';
            if (!confirm(savol)) return;
            fetch('/api/admin/soov/' + id + '/' + qaror, { method: 'POST', headers: authHeaders() })
                .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
                .then(function (res) {
                    const box = document.getElementById('claimMessage');
                    if (!res.ok) {
                        box.innerHTML = stk('cancel') + ' ' + esc(res.data.xato || 'Bajarib bo\'lmadi');
                        box.className = 'message show err';
                    } else {
                        box.innerHTML = res.data.ogohlantirish
                            ? stk('warning') + ' ' + esc(res.data.ogohlantirish)
                            : (qaror === 'tasdiq' ? stk('check') + ' Tasdiqlandi. Egasiga bot xabar beradi.' : stk('cancel') + ' Rad etildi.');
                        box.className = 'message show ' + (res.data.ogohlantirish ? 'err' : 'ok');
                    }
                    setTimeout(function () { box.className = 'message'; }, 6000);
                    loadClaims();
                })
                .catch(function () {
                    const box = document.getElementById('claimMessage');
                    box.innerHTML = stk('cancel') + ' Serverga ulanib bo\'lmadi';
                    box.className = 'message show err';
                });
        }

        // ==== Obuna holati ====
        function obunaHolati(tugash) {
            if (!tugash) return stk('available') + ' Cheksiz obuna';
            var sana = new Date(tugash);
            var hozir = new Date();
            if (sana > hozir) {
                return stk('check') + ' Obuna: ' + sana.toLocaleDateString('uz-UZ') + ' gacha';
            }
            return stk('unavailable') + ' Obuna tugagan (' + sana.toLocaleDateString('uz-UZ') + ')';
        }

        function obunaBelgilash(id, nomi, joriy) {
            var savol = '«' + nomi + '» obuna tugash sanasini kiriting (YYYY-MM-DD formatda).\nBo\'sh qoldiring — cheksiz obuna.';
            var joriyKun = joriy ? joriy.substring(0, 10) : '';
            var input = prompt(savol, joriyKun);
            if (input === null) return;
            var body = {};
            if (input.trim() === '') {
                body.obunaTugashi = null;
            } else {
                var sana = new Date(input.trim() + 'T23:59:59');
                if (isNaN(sana.getTime())) { showMessage(stk('cancel') + ' Noto\'g\'ri sana formati', false); return; }
                body.obunaTugashi = input.trim() + 'T23:59:59';
            }
            fetch('/api/admin/dorixona/' + id + '/obuna', {
                method: 'POST',
                headers: authHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify(body)
            })
                .then(function (r) {
                    if (!r.ok) throw new Error();
                    showMessage(stk('check') + ' Obuna yangilandi', true);
                    loadPharmacies();
                })
                .catch(function () { showMessage(stk('cancel') + ' Yangilab bo\'lmadi', false); });
        }

        // ==== Excel import ====
        var excelRejim = '';

        function excelYangilash() {
            var id = document.getElementById('filterPharmacy').value;
            if (!id) { excelXabar(stk('cancel') + ' Avval dorixonani tanlang', false); return; }
            var nomi = document.getElementById('filterPharmacy').selectedOptions[0].text;
            if (!confirm('«' + nomi + '» dorixonasidagi BARCHA dorilar o\'chiriladi va Excel fayldagilar kiritiladi.\n\nDavom etsinmi?')) return;
            excelRejim = 'yangilash';
            document.getElementById('excelFile').click();
        }

        function excelQoshish() {
            var id = document.getElementById('filterPharmacy').value;
            if (!id) { excelXabar(stk('cancel') + ' Avval dorixonani tanlang', false); return; }
            excelRejim = 'qoshish';
            document.getElementById('excelFile').click();
        }

        function excelYuborish() {
            var fileInput = document.getElementById('excelFile');
            var file = fileInput.files[0];
            if (!file) return;
            var dorixonaId = document.getElementById('filterPharmacy').value;
            if (!dorixonaId) return;

            var url = excelRejim === 'yangilash'
                ? '/api/admin/dori/import/' + dorixonaId
                : '/api/admin/dori/qoshish-import/' + dorixonaId;

            document.getElementById('excelHolat').textContent = 'Yuklanmoqda...';
            var formData = new FormData();
            formData.append('file', file);

            fetch(url, { method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: formData })
                .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
                .then(function (res) {
                    document.getElementById('excelHolat').textContent = '';
                    if (!res.ok) {
                        excelXabar(stk('cancel') + ' ' + (res.data.xato || 'Xatolik'), false);
                    } else {
                        excelXabar(stk('check') + ' ' + res.data.soni + ' ta dori ' + (excelRejim === 'yangilash' ? 'yangilandi' : 'qo\'shildi'), true);
                        loadDrugs();
                        loadStats();
                    }
                })
                .catch(function () {
                    document.getElementById('excelHolat').textContent = '';
                    excelXabar(stk('cancel') + ' Serverga ulanib bo\'lmadi', false);
                });

            fileInput.value = '';
        }

        function excelXabar(text, ok) {
            var box = document.getElementById('excelMessage');
            if (!box) return;
            box.innerHTML = text;
            box.className = 'message show ' + (ok ? 'ok' : 'err');
            setTimeout(function () { box.className = 'message'; }, 5000);
        }

        function loadUsers() {
            fetch('/api/admin/users', { headers: authHeaders() })
                .then(function (r) { return r.json(); })
                .then(function (users) {
                    document.getElementById('userList').innerHTML =
                        '<p class="subtitle">Jami: ' + users.length + '</p>' +
                        users.map(function (u) {
                            return `<div class="row">
                                <span><span class="row-main">${esc(u.name || 'Noma\'lum')}</span>
                                <span class="row-sub">${stk('phone')} ${esc(u.phoneNumber || '—')} · ID ${u.id} · ${u.isVerified ? stk('check') + ' tasdiqlangan' : stk('waiting') + ' tasdiqlanmagan'}</span></span>
                            </div>`;
                        }).join('');
                })
                .catch(function () {
                    document.getElementById('userList').innerHTML = '<p class="subtitle">Yuklab bo\'lmadi</p>';
                });
        }
    </script>
</body>
</html>
