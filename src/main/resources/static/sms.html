<!DOCTYPE html>
<html lang="uz">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="auth-guard.js"></script>
    <script src="stickers.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Kod - Dori Qidiruv</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: #03100D;
            min-height: 100vh;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .sms-container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .logo {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }

        .app-name {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(140deg, #3AE0BC, #16C6A4 55%, #0E6B5C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 3rem;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 3rem 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 0.3rem;
            font-size: 0.95rem;
        }

        .phone-display {
            color: #16C6A4;
            font-weight: 600;
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
        }

        .code-inputs {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .code-input {
            width: 60px;
            height: 70px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            color: white;
            font-size: 1.8rem;
            text-align: center;
            outline: none;
            transition: all 0.3s;
            font-weight: 600;
        }

        .code-input:focus {
            border-color: #16C6A4;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(22, 198, 164, 0.3);
            transform: scale(1.05);
        }

        .submit-btn {
            width: 100%;
            padding: 1.2rem;
            border: none;
            background: linear-gradient(140deg, #3AE0BC, #16C6A4 55%, #0E6B5C);
            color: white;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 1.5rem;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(22, 198, 164, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .resend-link {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s;
            display: inline-block;
            margin-bottom: 1rem;
        }

        .resend-link:hover {
            color: #16C6A4;
        }

        .back-link {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #16C6A4;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .lang-switch {
            display: flex;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.3rem;
            border-radius: 20px;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .lang-btn {
            padding: 0.4rem 1rem;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .lang-btn.active {
            background: linear-gradient(140deg, #3AE0BC, #16C6A4 55%, #0E6B5C);
            color: white;
        }

        @media (max-width: 480px) {
            .code-input {
                width: 50px;
                height: 60px;
                font-size: 1.5rem;
            }

            .code-inputs {
                gap: 0.5rem;
            }

            .glass-card {
                padding: 2.5rem 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }
        }

        /* ============================================================
           Suyuq shisha — bosh sahifa bilan bir xil chuqurlik va fon.
           Quyidagi qoidalar yuqoridagilarni to'ldiradi.
           ============================================================ */
        .aurora {
            position: fixed; inset: 0; z-index: -1; overflow: hidden;
            background:
                radial-gradient(1100px 700px at 50% -12%, #0F3B34 0%, transparent 62%),
                linear-gradient(180deg, #061815 0%, #03100D 58%);
        }
        .aurora span {
            position: absolute; display: block; border-radius: 50%;
            filter: blur(80px); opacity: 0.85; will-change: transform;
        }
        .aurora span:nth-child(1) {
            width: 46vw; height: 46vw; min-width: 320px; min-height: 320px;
            left: -10vw; top: -8vw;
            background: radial-gradient(circle, #12907A, transparent 68%);
            animation: suzish-a 26s cubic-bezier(0.4,0,0.2,1) infinite alternate;
        }
        .aurora span:nth-child(2) {
            width: 40vw; height: 40vw; min-width: 280px; min-height: 280px;
            right: -8vw; bottom: -6vw;
            background: radial-gradient(circle, #0D6C7A, transparent 68%);
            animation: suzish-b 32s cubic-bezier(0.4,0,0.2,1) infinite alternate;
        }
        @keyframes suzish-a { to { transform: translate3d(9vw, 7vh, 0) scale(1.14); } }
        @keyframes suzish-b { to { transform: translate3d(-8vw, -9vh, 0) scale(1.1); } }

        /* Shishaning qalinligi: tepa qirrasida yorug'lik, chekkasida sinish halqasi */
        .glass-card {
            position: relative;
            background: linear-gradient(160deg,
                rgba(255,255,255,0.095) 0%, rgba(255,255,255,0.055) 42%, rgba(255,255,255,0.03) 100%);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            border: none;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.30),
                inset 0 -1px 0 rgba(255,255,255,0.05),
                inset 0 0 30px rgba(255,255,255,0.035),
                0 18px 50px rgba(0,0,0,0.5),
                0 3px 10px rgba(0,0,0,0.32);
        }
        .glass-card::after {
            content: ''; position: absolute; inset: 0;
            border-radius: inherit; padding: 1px;
            background: linear-gradient(145deg,
                rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.08) 26%,
                rgba(255,255,255,0) 52%, rgba(255,255,255,0.06) 74%, rgba(255,255,255,0.22) 100%);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
            pointer-events: none;
        }

        /* Yorqin ko'kimtir-yashil fonda oq matn o'qilmaydi — to'q rang qo'yamiz */
        .submit-btn, .lang-btn.active, .logout-btn { color: #04211C; }

        .submit-btn, .logout-btn {
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 6px 20px rgba(22,198,164,0.3);
            font-family: inherit;
        }
        .submit-btn:hover, .logout-btn:hover { filter: brightness(1.06); }

        .country-select option { background: #08211C; color: #E9F3F0; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        :focus-visible { outline: 2px solid #16C6A4; outline-offset: 3px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="aurora" aria-hidden="true"><span></span><span></span></div>

    <div class="sms-container">
        <div class="logo"><img class="stk" style="width:4.2rem;height:4.2rem" data-stk="phone" alt="" src="icons/phone.png" onerror="stkFallback(this)"></div>
        <div class="app-name">Dori Qidiruv</div>
        
        <div class="glass-card">
            <div class="lang-switch">
                <button type="button" class="lang-btn active" data-lang="uz" onclick="setLang('uz')">UZ</button>
                <button type="button" class="lang-btn" data-lang="ru" onclick="setLang('ru')">RU</button>
            </div>

            <h1 data-uz="SMS kodni kiriting" data-ru="Введите SMS код">SMS kodni kiriting</h1>
            <p class="subtitle" data-uz="Raqamingizga yuborilgan kodni kiriting" data-ru="Введите код, отправленный на ваш номер">Raqamingizga yuborilgan kodni kiriting</p>
            <p class="phone-display" id="phoneDisplay">+998 XX XXX XX XX</p>
            
            <form id="smsForm" onsubmit="handleSubmit(event)">
                <div class="code-inputs">
                    <input type="text" class="code-input" maxlength="1" data-index="0" autocomplete="off">
                    <input type="text" class="code-input" maxlength="1" data-index="1" autocomplete="off">
                    <input type="text" class="code-input" maxlength="1" data-index="2" autocomplete="off">
                    <input type="text" class="code-input" maxlength="1" data-index="3" autocomplete="off">
                    <input type="text" class="code-input" maxlength="1" data-index="4" autocomplete="off">
                    <input type="text" class="code-input" maxlength="1" data-index="5" autocomplete="off">
                </div>
                
                <p class="error-message" id="errorMessage" data-uz="Noto'g'ri kod" data-ru="Неверный код">Noto'g'ri kod</p>
                
                <button type="submit" class="submit-btn" id="submitBtn" data-uz="Tasdiqlash" data-ru="Подтвердить">Tasdiqlash</button>
                
                <a href="#" class="resend-link" onclick="resendCode(event)" data-uz="Kodni qayta yuborish" data-ru="Отправить код повторно">Kodni qayta yuborish</a><br>
                <a href="login.html" class="back-link" data-uz="← Orqaga" data-ru="← Назад">← Orqaga</a>
            </form>
        </div>
    </div>

    <script>
        // Til tanlovi login sahifasidan shu yerga ham o'tadi.
        let currentLang = localStorage.getItem('lang') || 'uz';

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
            });

            document.querySelectorAll('[data-uz]').forEach(el => {
                el.textContent = el.getAttribute('data-' + lang);
            });

            document.documentElement.lang = lang;
        }

        /** Raqamni davlatiga qarab guruhlab ko'rsatadi (+998 90 123 45 67 / +7 912 345 67 89). */
        function formatPhone(value) {
            const digits = (value || '').replace(/\D/g, '');
            if (digits.startsWith('998') && digits.length === 12) {
                const n = digits.slice(3);
                return '+998 ' + n.slice(0, 2) + ' ' + n.slice(2, 5) + ' ' + n.slice(5, 7) + ' ' + n.slice(7);
            }
            if (digits.startsWith('7') && digits.length === 11) {
                const n = digits.slice(1);
                return '+7 ' + n.slice(0, 3) + ' ' + n.slice(3, 6) + ' ' + n.slice(6, 8) + ' ' + n.slice(8);
            }
            return value;
        }

        const phone = localStorage.getItem('phone') || '';
        const phoneDisplay = document.getElementById('phoneDisplay');
        phoneDisplay.textContent = phone ? formatPhone(phone) : '+998 XX XXX XX XX';

        const inputs = document.querySelectorAll('.code-input');
        const errorMessage = document.getElementById('errorMessage');

        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const value = e.target.value;
                
                if (value.match(/[0-9]/)) {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                } else {
                    e.target.value = '';
                }
                
                errorMessage.classList.remove('show');
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
                
                if (e.key === 'ArrowLeft' && index > 0) {
                    inputs[index - 1].focus();
                }
                
                if (e.key === 'ArrowRight' && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').replace(/\D/g, '');
                
                for (let i = 0; i < Math.min(pastedData.length, 6); i++) {
                    if (index + i < inputs.length) {
                        inputs[index + i].value = pastedData[i];
                    }
                }
                
                const lastFilledIndex = Math.min(index + pastedData.length, inputs.length - 1);
                inputs[lastFilledIndex].focus();
            });
        });

        async function handleSubmit(e) {
            e.preventDefault();

            const code = Array.from(inputs).map(input => input.value).join('');

            if (code.length !== 6) {
                errorMessage.textContent = currentLang === 'uz'
                    ? 'Iltimos, barcha raqamlarni kiriting'
                    : 'Пожалуйста, введите все цифры';
                errorMessage.classList.add('show');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = currentLang === 'uz' ? 'Tekshirilmoqda...' : 'Проверка...';

            try {
                const response = await fetch('/api/auth/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber: phone, code })
                });
                const data = await response.json();

                if (!response.ok || !data.token) {
                    errorMessage.textContent = data.message || errorMessage.textContent;
                    errorMessage.classList.add('show');
                    submitBtn.disabled = false;
                    submitBtn.textContent = currentLang === 'uz' ? 'Tasdiqlash' : 'Подтвердить';
                    return;
                }

                localStorage.setItem('token', data.token);
                window.location.href = 'ism.html';
            } catch (error) {
                errorMessage.textContent = currentLang === 'uz'
                    ? 'Serverga ulanib bo\'lmadi. Qayta urinib ko\'ring.'
                    : 'Не удалось подключиться к серверу. Попробуйте снова.';
                errorMessage.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.textContent = currentLang === 'uz' ? 'Tasdiqlash' : 'Подтвердить';
            }
        }

        async function resendCode(e) {
            e.preventDefault();
            const link = e.target;
            link.style.opacity = '0.5';
            link.style.pointerEvents = 'none';

            const originalText = link.textContent;
            try {
                await fetch('/api/auth/send-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber: phone })
                });
                link.textContent = currentLang === 'uz' ? 'Yuborildi ✓' : 'Отправлено ✓';
            } catch (error) {
                link.textContent = currentLang === 'uz' ? 'Xatolik ✗' : 'Ошибка ✗';
            }

            setTimeout(() => {
                link.style.opacity = '1';
                link.style.pointerEvents = 'auto';
                link.textContent = originalText;
            }, 3000);
        }

        setLang(currentLang);
        inputs[0].focus();
    </script>
</body>
</html>
