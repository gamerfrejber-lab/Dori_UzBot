<!DOCTYPE html>
<html lang="uz">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish - Dori Qidiruv</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #0d1b3e 100%);
            min-height: 100vh;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .app-name {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4fc3f7, #7c4dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 3rem;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 3rem 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .phone-input-wrapper {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 2rem;
        }

        /* Davlat kodi tanlovi: O'zbekiston (+998) va Rossiya (+7) raqamlari ham qabul qilinadi. */
        .country-select {
            flex: 0 0 auto;
            padding: 1.2rem 0.5rem;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50px;
            color: #4fc3f7;
            font-weight: 600;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .country-select:focus {
            border-color: #4fc3f7;
            box-shadow: 0 0 20px rgba(79, 195, 247, 0.3);
        }

        .country-select option {
            background: #0d1b3e;
            color: #fff;
        }

        .phone-input {
            flex: 1;
            min-width: 0;
            padding: 1.2rem 1.1rem;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .phone-input:focus {
            border-color: #4fc3f7;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(79, 195, 247, 0.3);
        }

        .phone-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .submit-btn {
            width: 100%;
            padding: 1.2rem;
            border: none;
            background: linear-gradient(135deg, #4fc3f7, #7c4dff);
            color: white;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 1.5rem;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(79, 195, 247, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .back-link {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #4fc3f7;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .telegram-hint {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(79, 195, 247, 0.1);
            border: 1px solid rgba(79, 195, 247, 0.3);
            border-radius: 16px;
            padding: 0.9rem 1.1rem;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.85);
            text-align: left;
        }

        .telegram-hint a {
            color: #4fc3f7;
            font-weight: 600;
            text-decoration: none;
        }

        .telegram-hint a:hover {
            text-decoration: underline;
        }

        .lang-switch {
            display: flex;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.3rem;
            border-radius: 20px;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .lang-btn {
            padding: 0.4rem 1rem;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, #4fc3f7, #7c4dff);
            color: white;
        }

        @media (max-width: 480px) {
            .glass-card {
                padding: 2.5rem 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .phone-input {
                font-size: 1rem;
                letter-spacing: 0;
            }

            .country-select {
                padding: 1.2rem 0.35rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">💊</div>
        <div class="app-name">Dori Qidiruv</div>
        
        <div class="glass-card">
            <div class="lang-switch">
                <button type="button" class="lang-btn active" data-lang="uz" onclick="setLang('uz', this)">UZ</button>
                <button type="button" class="lang-btn" data-lang="ru" onclick="setLang('ru', this)">RU</button>
            </div>

            <h1 data-uz="Telefon raqamingizni kiriting" data-ru="Введите номер телефона">Telefon raqamingizni kiriting</h1>
            <p class="subtitle" data-uz="Tasdiqlash kodi yuboriladi" data-ru="Вам будет отправлен код подтверждения">Tasdiqlash kodi yuboriladi</p>

            <div class="telegram-hint">
                <span>📌</span>
                <span data-uz-html="Kodni tezroq olish uchun avval Telegram'da <a href='https://t.me/dori_UzBot' target='_blank' rel='noopener'>@dori_UzBot</a>'ga <b>/start</b> bosing." data-ru-html="Чтобы код пришёл быстрее, сначала нажмите <b>/start</b> в Telegram у <a href='https://t.me/dori_UzBot' target='_blank' rel='noopener'>@dori_UzBot</a>.">Kodni tezroq olish uchun avval Telegram'da <a href="https://t.me/dori_UzBot" target="_blank" rel="noopener">@dori_UzBot</a>'ga <b>/start</b> bosing.</span>
            </div>

            <form id="loginForm" onsubmit="handleSubmit(event)">
                <div class="phone-input-wrapper">
                    <select class="country-select" id="countrySelect" onchange="onCountryChange()"
                            data-uz-aria="Davlat kodi" data-ru-aria="Код страны" aria-label="Davlat kodi">
                        <option value="998">🇺🇿 +998</option>
                        <option value="7">🇷🇺 +7</option>
                    </select>
                    <input
                        type="tel"
                        class="phone-input"
                        id="phoneInput"
                        placeholder="00 000 00 00"
                        maxlength="14"
                        autocomplete="off"
                        required
                    >
                </div>
                <p class="error-message" id="errorMessage"
                   data-uz="Iltimos, to'g'ri raqam kiriting" data-ru="Пожалуйста, введите правильный номер">Iltimos, to'g'ri raqam kiriting</p>
                
                <button type="submit" class="submit-btn" id="submitBtn" data-uz="Kod yuborish" data-ru="Отправить код">Kod yuborish</button>
                <a href="index.html" class="back-link" data-uz="← Bosh sahifaga qaytish" data-ru="← Вернуться на главную">← Bosh sahifaga qaytish</a>
            </form>
        </div>
    </div>

    <script>
        /*
         * Qo'llab-quvvatlanadigan davlatlar. Har birining milliy raqami uzunligi va
         * guruhlab yozilishi har xil: O'zbekistonda 9 xona (90 123 45 67),
         * Rossiyada 10 xona (912 345 67 89).
         */
        const COUNTRIES = {
            '998': { digits: 9,  groups: [2, 3, 2, 2], placeholder: '00 000 00 00' },
            '7':   { digits: 10, groups: [3, 3, 2, 2], placeholder: '000 000 00 00' }
        };

        // Til tanlovi sahifalar orasida saqlanadi, aks holda har o'tishda o'zbekchaga qaytardi.
        let currentLang = localStorage.getItem('lang') || 'uz';

        function setLang(lang, button) {
            currentLang = lang;
            localStorage.setItem('lang', lang);

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
            });

            document.querySelectorAll('[data-uz]').forEach(el => {
                el.textContent = el.getAttribute('data-' + lang);
            });

            document.querySelectorAll('[data-uz-html]').forEach(el => {
                el.innerHTML = el.getAttribute('data-' + lang + '-html');
            });

            document.querySelectorAll('[data-uz-aria]').forEach(el => {
                el.setAttribute('aria-label', el.getAttribute('data-' + lang + '-aria'));
            });

            document.documentElement.lang = lang;
            applyCountry();
        }

        const phoneInput = document.getElementById('phoneInput');
        const countrySelect = document.getElementById('countrySelect');
        const errorMessage = document.getElementById('errorMessage');

        function country() {
            return COUNTRIES[countrySelect.value] || COUNTRIES['998'];
        }

        /** Raqamlarni tanlangan davlat qoidasi bo'yicha guruhlab yozadi. */
        function formatPhone(digits, rules) {
            let out = '';
            let at = 0;
            for (const size of rules.groups) {
                if (at >= digits.length) break;
                out += (out ? ' ' : '') + digits.slice(at, at + size);
                at += size;
            }
            return out;
        }

        function applyCountry() {
            phoneInput.placeholder = country().placeholder;
            phoneInput.value = formatPhone(phoneInput.value.replace(/\D/g, '').slice(0, country().digits), country());
        }

        function onCountryChange() {
            localStorage.setItem('countryCode', countrySelect.value);
            errorMessage.classList.remove('show');
            applyCountry();
            phoneInput.focus();
        }

        phoneInput.addEventListener('input', (e) => {
            const rules = country();
            const value = e.target.value.replace(/\D/g, '').slice(0, rules.digits);
            e.target.value = formatPhone(value, rules);
            errorMessage.classList.remove('show');
        });

        async function handleSubmit(e) {
            e.preventDefault();

            const rules = country();
            const phone = phoneInput.value.replace(/\D/g, '');

            if (phone.length !== rules.digits) {
                errorMessage.textContent = currentLang === 'uz'
                    ? 'Iltimos, to\'g\'ri raqam kiriting (' + rules.digits + ' ta raqam)'
                    : 'Пожалуйста, введите правильный номер (' + rules.digits + ' цифр)';
                errorMessage.classList.add('show');
                return;
            }

            const fullPhone = '+' + countrySelect.value + phone;

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = currentLang === 'uz' ? 'Yuborilmoqda...' : 'Отправка...';

            try {
                const response = await fetch('/api/auth/send-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber: fullPhone })
                });
                const data = await response.json();

                if (!response.ok) {
                    errorMessage.textContent = data.message || (currentLang === 'uz' ? 'Xatolik yuz berdi' : 'Произошла ошибка');
                    errorMessage.classList.add('show');
                    submitBtn.disabled = false;
                    submitBtn.textContent = currentLang === 'uz' ? 'Kod yuborish' : 'Отправить код';
                    return;
                }

                localStorage.setItem('phone', fullPhone);
                window.location.href = 'sms.html';
            } catch (error) {
                errorMessage.textContent = currentLang === 'uz'
                    ? 'Serverga ulanib bo\'lmadi. Qayta urinib ko\'ring.'
                    : 'Не удалось подключиться к серверу. Попробуйте снова.';
                errorMessage.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.textContent = currentLang === 'uz' ? 'Kod yuborish' : 'Отправить код';
            }
        }

        // Oldingi tanlovlarni tiklaymiz: til va davlat kodi.
        countrySelect.value = localStorage.getItem('countryCode') || '998';
        setLang(currentLang);
        phoneInput.focus();
    </script>
</body>
</html>
